# trust: PHASE 1 SUPPLY-CHAIN REPLACEMENT — the Trust-owned crypto primitives.
#
# `trust-sha2` is MANDATORY here, not cosmetic: `crates/trust-ed25519/Cargo.toml`
# writes `trust-sha2 = { workspace = true }`, and a workspace member that
# inherits a name this table does not define is a manifest-LOAD failure —
# "`dependency.trust-sha2` was not found in `workspace.dependencies`" — raised
# while loading the WORKSPACE, so it reds every root cargo/x.py command, not
# just that member. That is why the `members` additions above, these lines, and
# the `sha2`/`ed25519-dalek` rewrites below are ONE change: any prefix of them
# fails to load.
trust-sha2 = { path = "crates/trust-sha2" }
trust-ed25519 = { path = "crates/trust-ed25519" }
# The one production consumer is `trust-proof-cert`, which names this directly
# rather than through a `rand` alias — see the retired `rand` entry below.
trust-rand = { path = "crates/trust-rand" }
trust-ratio = { path = "crates/trust-ratio" }
fs2 = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# trust: PHASE 1a. The name resolves to the Trust-owned crate through Cargo's
# dependency RENAMING. Every member writing `sha2 = { workspace = true }` and
# `use sha2::{Digest, Sha256}` compiles verbatim; the crate behind the name is
# ours. This also reaches the shipped compiler, since rustc-main ->
# rustc_interface -> rustc_mir_transform -> trust-router -> trust-proof-cert.
#
# The acceptance gate stays REAL: `crates/trust-sha2` dev-depends on the
# incumbent by EXPLICIT VERSION (`sha2 = "0.10"`), not through this table, so
# `tests/differential_sha2.rs` keeps comparing against crates.io rather than
# against itself.
sha2 = { package = "trust-sha2", path = "crates/trust-sha2" }
tempfile = "3"
# trust #837: Deterministic hashing for compilation reproducibility
rustc-hash = "2.0.0"
indexmap = "2.7"
# trust: PHASE 1e, same rename mechanism as `sha2` above — and, like `sha2`,
# this is the ROOT half. `trust-version`, `trust-bmc` and `trust-router` are
# members of BOTH workspaces (as `trust-deps` was until it was retired); without
# this line the same crates would compile against `trust-toml` under `crates/`
# and against the incumbent `toml` under the root, i.e. two different TOML implementations
# depending on which workspace built them.
#
# The acceptance gate stays REAL for the same reason it does in
# `crates/Cargo.toml`: `crates/trust-toml` dev-depends on `toml 0.8.23` by
# explicit version, not through this table.
toml = { package = "trust-toml", path = "crates/trust-toml" }
num-bigint = "0.4"
# Trust: mirrors `crates/Cargo.toml`'s entry exactly. `crates/trust-certify`
# inherits it (`num-rational = { workspace = true }`, added by 7789ff8714) and is in
# rustc-main's dependency closure through trust-vcgen -> trust-mir-extract ->
# trust-ir-bridge -> trust-cg-bridge -> rustc_codegen_trust_cg, so the ROOT
# workspace must define it too. The two workspaces have separate
# `[workspace.dependencies]` tables and separate lockfiles; adding a member
# dependency to one of them alone makes the other fail to LOAD its manifest, which
# is a broken build rather than a version split (measured: `error inheriting
# `num-rational` from workspace root manifest's `workspace.dependencies`).
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
bincode = "1.3"
proptest = "1.11"
# trust: PHASE 1d, same rename mechanism. Retires the incumbent's 34-package
# closure — `curve25519-dalek(+derive)`, `fiat-crypto`, `ed25519`, `signature`,
# `subtle`, `zeroize`, `rand_core` — from the compiler's own runtime graph.
#
# BOTH FEATURES ARE GONE, AND THAT IS NOT AN OVERSIGHT. `trust-ed25519`
# declares no `[features]` at all, and Cargo hard-errors on a feature a renamed
# dependency does not have ("... depends on X with feature `serde` but X does
# not have that feature"), so a stale list here is a build stopper rather than
# a silent no-op.
#   * `rand_core` existed only to reach `SigningKey::generate`, whose bound is
#     the third-party `rand_core::CryptoRngCore`. `trust-ed25519` deliberately
#     omits that constructor; `trust-proof-cert::CertSigningKey::generate` now
#     seeds `from_bytes` with `trust_rand::secret_seed_32()`, and the two
#     spellings are proved equal by
#     `crates/trust-rand/tests/ed25519_equivalence.rs`.
#   * `serde` was UNUSED, verified rather than assumed: `trust-proof-cert` is
#     the sole reverse-dependency of this entry in the root graph, no dalek
#     type appears in any `#[derive(Serialize)]`/`Deserialize` there, and
#     `CertificateSignature` stores the signature and public key as `Vec<u8>`
#     it encodes itself.
ed25519-dalek = { package = "trust-ed25519", path = "crates/trust-ed25519" }
# `rand` IS GONE from this table. It had exactly one reverse-dependency here —
# `trust-proof-cert`, for one 32-byte keygen draw — and that call site now uses
# `trust-rand` directly. No rustc crate inherits `rand` from the workspace:
# `rustc_incremental`, `rustc_interface`, `rustc_abi` and `rustc_thread_pool`
# each pin `rand = "0.9.x"` explicitly, so `rand` remains in the lockfile for
# them and this deletion cannot affect their build.
#
# Deliberately NOT replaced by `rand = { package = "trust-rand", ... }`:
# sha2/ed25519-dalek are drop-ins, so renaming their names is a
# zero-source-edit swap, but `rand`'s surface is enormous and `trust-rand`
# implements the one function this tree called. An alias would make every other
# `rand::` path resolve to nothing and report the error at the CONSUMER.
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }
libc = "0.2"
# Trust: inherited by crates/trust-router (`tracing.workspace = true`, optional,
# feature `ay-backend`) — the in-process ay backend scopes a no-op thread-local
# tracing subscriber around each solve so ay's solver-internal WARN diagnostics
# never leak onto trustc's stderr (rustc_log's default filter is a bare
# LevelFilter::WARN). Without this entry the root workspace fails to load
# trust-router's manifest. Unifies with the compiler's existing tracing 0.1.
tracing = "0.1"
# trust: repo-owned core verification stack snapshots.
tla-mc-core = { path = "first-party/ty/crates/tla-mc-core" }
ay = { path = "first-party/ay/crates/ay" }
ay-bindings = { path = "first-party/ay/crates/ay-bindings" }
# trust: ay-core (ay's structured proof data structures) — inherited by
# crates/trust-router (`ay-core.workspace = true`, optional, feature `ay_certify`),
# which the ROOT/compiler workspace pulls in transitively via rustc_codegen_trust_cg.
# Without this entry the root workspace fails to load trust-router's manifest
# (`dependency.ay-core was not found in workspace.dependencies`). crates/Cargo.toml
# already defines it for the crates/ sub-workspace; the root needs its own copy.
ay-core = { path = "first-party/ay/crates/ay-core" }
# trust: ay-proof zero-trust bit-blast proof exporter — inherited by
# crates/trust-cg-bridge (`ay-proof.workspace = true`, optional), which the root
# build pulls in via rustc_codegen_trust_cg's `ay-proofs` feature. Without this
# entry the root workspace manifest fails to load (`error inheriting ay-proof`).
ay-proof = { path = "first-party/ay/crates/ay-proof" }
# trust: sealed-authority S3 replay oracle — inherited by crates/trust-bmc
# (ay-chc.workspace = true, optional, feature trust-mc-native-solver). Same
# root-workspace-copy rule as ay-core/ay-proof above.
ay-chc = { path = "first-party/ay/crates/ay-chc" }
trust-mc-core = { path = "first-party/trust-mc/trust-mc-core" }
trust-mc-trust-bmc = { path = "first-party/trust-mc/trust-mc-trust-bmc" }
trust-wp-core = { path = "first-party/trust-wp/crates/trust-wp-core" }
trust-wp-ay = { path = "first-party/trust-wp/crates/trust-wp-ay" }
trust-wp-lib = { path = "first-party/trust-wp/crates/trust-wp-lib" }
trust-vc-core = { path = "first-party/trust-vc/crates/trust-vc-core" }
trust-cg-ir = { path = "first-party/trust-cg/crates/trust-cg-ir" }
trust-cg-dialect = { path = "first-party/trust-cg/crates/trust-cg-dialect" }
trust-cg-lower = { path = "first-party/trust-cg/crates/trust-cg-lower" }
trust-cg-opt = { path = "first-party/trust-cg/crates/trust-cg-opt" }
trust-cg-regalloc = { path = "first-party/trust-cg/crates/trust-cg-regalloc" }
trust-cg-verify = { path = "first-party/trust-cg/crates/trust-cg-verify", default-features = false }
trust-cg-codegen = { path = "first-party/trust-cg/crates/trust-cg-codegen" }
trust-cg-bridge = { path = "crates/trust-cg-bridge" }
# Trust: `crates/trust-ir-bridge` is a member of BOTH workspaces and inherits
# `trust-intbound` with `workspace = true`, so the ROOT workspace must declare
# the key too. The crate itself is stock-rustc-parseable: its native-grammar
# contracts live behind a cfg-stripped `include!` that build.rs turns on only
# under trustc -- see crates/trust-intbound/src/lib.rs. (The attribute contract
# spelling was tried and REJECTED with a control: it LOSES PROOFS.)
trust-intbound = { path = "crates/trust-intbound" }
# Trust: wave three. `crates/trust-vcgen` is a root member too, and its verified
# dep uses trust-intbound's cfg-stripped `include!` mechanism from the start --
# no stub, one path for both workspaces. See crates/trust-floatbits/src/lib.rs.
trust-floatbits = { path = "crates/trust-floatbits" }
# Trust: trust-widthconv and trust-budget carry native-grammar contracts behind
# the same cfg-stripped include! mechanism as trust-intbound (see its lib.rs
# header), so the real crates are stock-rustc-parseable and the root workspace
# consumes them directly. Do not mint stubs; that remedy fixed one workspace and
# broke in the next (targo-trust's tool build resolves through crates/).
trust-widthconv = { path = "crates/trust-widthconv" }
trust-budget = { path = "crates/trust-budget" }
trust-ir-bridge = { path = "crates/trust-ir-bridge" }
trust-wasm-bridge = { path = "crates/trust-wasm-bridge" }
# Trust: clean-expr = CleanCic kernel-replay proof authority (native TrustVc
