# trust: workspace-level lint policy
[workspace.lints.rust]
warnings = "warn"
# The compiler owns this cfg; declaring its spelling never enables it. Keep
# helper crates free of executable build scripts that only repeat this fact.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trust_verify)'] }
# Trust-owned crates keep the developer lint policy after consolidation.
env_mutation = "warn"
unknown_lints = "allow"

# trust: workspace-level package metadata for verification pipeline crates
[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alabsystems/trust"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

# trust: workspace-level dependencies shared by verification pipeline crates
[workspace.dependencies]
trust-types = { path = "crates/trust-types" }
trust-odt = { path = "crates/trust-odt" }
trust-verifier-api = { path = "crates/trust-verifier-api" }
# trust: cross-repo shared verification vocabulary, re-exported by
# trust-types/trust-verifier-api (see first-party/trust-ir/crates/trust-ir-contract).
trust-ir-contract = { path = "first-party/trust-ir/crates/trust-ir-contract" }
# trust (#2c/#2d): in-process Certified-tier bridge + the clean crates it drives.
# trust-certify links into rustc_mir_transform so the live verify path can mint
# kernel-CHECKED CleanCic certificates (de Bruijn criterion). clean-auto/clean-kernel
# are NOT in the TCB — their output is re-checked by the clean kernel; a bad
# reconstruction fails closed to Trusted.
trust-certify = { path = "crates/trust-certify" }
# Trust's canonical temporal vocabulary (Clean source text) that trust-certify
# serves to islands importing it; text only, no dependencies.
trust-temporal-prelude = { path = "crates/trust-temporal-prelude" }
trust-cert-meter = { path = "crates/trust-cert-meter" }
trust-spec-elab = { path = "crates/trust-spec-elab" }
# Trust (I5): the two Clean-origin CALL-lane decisions — the gated `DefId` mint
# and the carrier-typed faithfulness gate. Named from `rustc_mir_transform`,
# whose `clean_origin_mir.rs` is the sole constructor of a Clean-origin `Body`
# and cannot return one without a `trust_clean_origin::Faithful`.
trust-clean-origin = { path = "crates/trust-clean-origin" }
# The Clean -> TrustIR producer. Consumes the same sealed `CleanOriginPlan`
# `clean_origin_mir` does, and emits `trust_ir::Function` instead of `Body`.
trust-clean-ir = { path = "crates/trust-clean-ir" }
# Independent actual-Function reflector and digest-bound carrier gate for the
# bounded Clean-origin TrustIR fragment.
trust-clean-ir-gate = { path = "crates/trust-clean-ir-gate" }
trust-clean-carrier = { path = "crates/trust-clean-carrier" }
clean-kernel = { path = "first-party/clean/crates/clean-kernel", features = ["math-overlays"] }
# Trust (kernel-tv, docs/design/2026-08-27-two-language-direct-to-trust-ir.md §4):
# the PRODUCING denotation map for the Clean-origin TV tier. Its trust-ir git
# dep is captured by the [patch."…trust-ir.git"] tables above; its clean-kernel
# workspace dep resolves against first-party/clean's own workspace.
clean-reflect = { path = "first-party/clean/crates/clean-reflect" }
# Trust (totality campaign, general Clean lane): the GENERAL Clean -> trust-ir
# compiler (kernel Expr -> L5CNF -> L5IR -> trust_ir::Module). Its trust-ir /
# trust-ir-build / trust-ir-conformance git deps are captured by the [patch]
# tables below; clean-kernel resolves via first-party/clean's own workspace.
clean-compiler = { path = "first-party/clean/crates/clean-compiler" }
clean-auto = { path = "first-party/clean/crates/clean-auto" }
clean-verify = { path = "first-party/clean/crates/clean-verify" }
clean-parser = { path = "first-party/clean/crates/clean-parser" }
clean-elab = { path = "first-party/clean/crates/clean-elab" }
