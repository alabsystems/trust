# Trust stage0 seed — publication ledger
#
# Records where the pinned `src/stage0` seed is published and admitted. Read by
# scripts/discover_trust_stage0_seed.py (inspect_release_ledger). The `checksums`
# set must be a superset of the archive SHA-256 pins in `src/stage0`.
#
# Honesty note: this seed is admitted INTERNAL, hosted on the *private*
# alabsystems/trust repo. promotion_decision is `admit-internal`, NOT
# `promote` — public promotion requires a non-placeholder signature and a
# publicly fetchable (unauthenticated) artifact. The discoverer therefore
# reports this ledger as `blocked` for public-release purposes by design; that
# is the correct, honest state for "host in the private repo, for now"
# (docs/OFF_STOCK_RUST_PLAN.md Phase 3).
#
# NOTE: these top-level keys (scope/promotion_decision/signatures/checksums) MUST
# stay above the [release]/[artifact_root] table headers — TOML would otherwise
# nest them under the preceding table and the discoverer reads them at top level.

scope = "internal"
promotion_decision = "admit-internal"

# Placeholder, non-public signature: this seed is not publicly signed. Present so
# the discoverer classifies the ledger as internal (blocked-for-public), never as
# a public-admission candidate on the strength of an empty signature list.
signatures = [
  "placeholder:internal-admission-only:not-publicly-signed",
]

# sha256:<hex> for every dist/*.tar.xz archive pinned in src/stage0 (all 9).
checksums = [
  "sha256:c675e2794d8da514d44f07d4bc397a5ff973ab5e018c244d1d1493b57bed19c0", # targo
  "sha256:8798cb9d256cb5c9180add71abbed6e98be872fae1b4fa22d0198a8754c00f6d", # targo-trust
  "sha256:ac00018177911a2583cbea7ddeef54e9e46278bb15127c783920b9f46cb563f9", # tippy
  "sha256:a2ef4ff50c5136e94a9a1899b59fb4fd4cd1b5f613077ce0b976142551ef96d0", # trust-analyzer
  "sha256:d5c82aee2b2fe233aa0ec8178a8f0eb8fe0f0a1d8b78302ce5ad31294e56ed48", # trust-src
  "sha256:d49c16dfdbf90f89b2866b959a25cfe5e3feee652a2fec21b2c9eafe34b928dd", # trust-std
  "sha256:fb1303066c27a852c05d61b8aaa38b483367f5b9597f5b0714e02530bb002cf5", # trustc
  "sha256:e61176cb5a62ca57a6352591c4b67928ed26625fcd4532d71fb2274996f46c83", # trustc-dev
  "sha256:f53edb54fdcfbb6cac19d0e79ace88aef4ffd3a177b7e6fa7ad842e930dbce55", # trustfmt
]

[release]
repo = "alabsystems/trust"
tag = "trust-stage0-2026-07-13"
title = "Trust stage0 seed 2026-07-13 (1.99.0-trust, aarch64-apple-darwin)"
date = "2026-07-13"
host_triple = "aarch64-apple-darwin"
compiler_version = "1.99.0-trust"
compiler_git_commit_hash = "629729f69eefb1cfe6ed766c6c01ee38aa7b0484"
channel_manifest_hash = "876835aa7f809338a2658e9c16beb4bd6b748d4ec2eae23468aa962e7fa4c22f"
visibility = "private"
authenticated_fetch = "gh release download trust-stage0-2026-07-13 --repo alabsystems/trust --dir bootstrap/trust-stage0/dist/2026-07-13 --pattern '*.tar.xz' --clobber"

# Distribution archive labels and product-reported versions are distinct
# namespaces. Bind the exact first line printed by every canonical version
# probe so provenance validation never assumes that an archive rename changes
# the embedded product identity.
[release.reported_product_identities]
trustc = "rustc 1.99.0-dev (629729f69 2026-07-13) (trustc)"
targo = "targo 1.99.0-dev"
trustfmt = "trustfmt 1.9.0-trust (629729f69e 2026-07-13)"

[artifact_root]
path = "https://github.com/alabsystems/trust/releases/tag/trust-stage0-2026-07-13"
