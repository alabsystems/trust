# The daily-driver corpora, as data (schema trust.corpora.v1).
#
# Read by `targo trust gate corpus-delta` (targo-trust/src/corpus_delta/), which
# compiles every case with each of two compilers and prints each case whose
# verdict moved against its pin (docs/PLAN.md PKG-S1 SE16). The table is read
# whole and refused whole: an unknown key, a glob that matches no file, a case
# declared twice, or a pin for a case that is not there is an error.
#
# [[corpus]]
#   id     the corpus's name in `--corpora` and in every report line
#   glob   case files, relative to the checkout; a case's id is its file stem
#   args   the compiler's arguments; the verb adds `--out-dir <scratch> <file>`.
#          Needed by `glob`, and by a [[corpus.case]] with no `args` of its own
#   pin    what every case must do: `verifies`, `refuses` or `conditional`;
#          absent: nothing is pinned, and `verifies` is the best outcome
#   pins   { case = pin } for the cases whose pin differs from `pin`
#   [[corpus.case]]  a case named one at a time, with or without a glob:
#     id, file, and optionally its own `args` (in place of the corpus's), `pin`,
#     and `log_contains` (below)
#   [[corpus.group]]  more case files, with their own arguments:
#     glob, args     as the corpus's
#     ids_under      a directory: a case's id is its path under it, without
#                    `.rs` (`arith/a1`), not its stem
#     env            { NAME = "value" } given to each case's compile
#     headers        each file states its own row in `//@ ` lines, in the named
#                    dialect (`trust-ladder` or `trust-ladder-xcrate`;
#                    targo-trust/src/corpus_delta/headers.rs has both): its
#                    pin, its crate type, a text its output must hold, the
#                    crate it is built against. A file with no pin line is an
#                    error, and `pins` may not name such a case
#     dependencies, dependency_args  (with `headers = "trust-ladder-xcrate"`)
#                    the crates the rows are built against, and their
#                    arguments. Each is built once for a compiler, before the
#                    first case that uses it, and is not a case; one no case
#                    uses is an error
#   [corpus.conditional]  what `conditional` asks; present exactly when a case
#     of the corpus is pinned so:
#     disclosure       the text a conditional case's output must hold, where
#                      the case has none of its own
#     certify_args     added after the case's arguments for its second compile
#     certify_refusal  the text that compile's output must hold
#
# What a row asks beyond an exit status (targo-trust/src/corpus_delta/judge.rs):
#   log_contains  the case is as pinned only when its compile's output has this
#                 text on one line. Looked for only when the exit status is the
#                 pinned one; without it the verdict is `verifies-otherwise` or
#                 `refuses-otherwise`
#   conditional   exit 0, the disclosure in the output, and a certify compile
#                 that exits non-zero with `certify_refusal` in its output.
#                 Exit 0 without the rest is `verifies`, ranked as a possible
#                 false proof
#   a dependency  one that refuses, or leaves no rlib, makes each of its cases
#                 `blocked`, whatever its pin
#
# [[not_on_yet]] names a daily-driver corpus that is still a script and has no
# row here: id, script, why. Every run of the verb that has read this table and
# its `--corpora` prints these as not compared, whatever its exit, and
# `--corpora <id>` for one is refused. There is none now: all six corpora are
# rows.
#
# Until a sealed toolchain carries the verb, each corpus below is also the script
# its `slow.*` harness row runs: scripts/ordinary_rust_sweep.sh,
# scripts/panicking_std_battery.sh, scripts/idiomatic_rust_sample.sh,
# scripts/daily_driver_bench.sh, scripts/daily_driver_probes.sh and
# scripts/open_dispatch_ladder.sh. The files, arguments, pins and texts here are
# those scripts' own, and targo-trust unit tests fail when they part
# (corpus_delta::tests::the_table_matches_the_corpus_scripts and
# corpus_delta::tests::cases::the_sweep_battery_and_idiomatic_scripts_compile_what_the_table_says
# for the first three, corpus_delta::tests::cases::the_*_table_matches_its_script
# for the others). Those tests compare a script's commands whole and hold a
# digest of the ones that are not rows, so a change to a script's code is red
# until it is read against this table and the digest recorded; the bench's
# files are compared with their rows byte for byte, which is why rustfmt.toml
# ignores tests/daily-driver-bench/. Where a script and the verb say different
# things of the same compile:
#   * a compiler that crashes is `crash:<status>` here, below a clean miss under
#     every pin; the scripts count any non-zero exit as a refusal;
#   * the battery script also requires `runtime-checked` in p07's output; that
#     is the script's own check and is not part of a verdict here;
#   * the bench script counts the cases that verify (its `N / 71 verified`), and
#     names fmt/m3 and fmt/m4 as correct refusals; here those two are pinned
#     `refuses`, so "as pinned" counts them when they refuse;
#   * the ladder script counts one more divergence for a dependency that does
#     not build than the rows built against it; here the rows are the cases;
#   * the ladder script skips a file with no `//@ trust-ladder:` line; here it
#     is an error.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0 OR MIT

schema = "trust.corpora.v1"

# Programs nobody aimed at a known boundary. Nothing is pinned.
[[corpus]]
id = "sweep"
glob = "tests/ordinary-rust-sweep/*.rs"
args = ["--crate-type=lib", "--edition", "2021"]

# Programs that can panic at run time: the falsification gate for the
# absent-callee tolerance. Each must be refused; p07 is the one documented
# conditional pass (tests/panicking-std-battery/README.md).
[[corpus]]
id = "battery"
glob = "tests/panicking-std-battery/*.rs"
args = ["--crate-type=lib", "--edition", "2021"]
pin = "refuses"
pins = { p07 = "verifies" }

# Programs written from a list of tasks, not from the failure list. Nothing is
# pinned.
[[corpus]]
id = "idiomatic"
glob = "tests/idiomatic-rust-sample/*.rs"
args = ["-Ztrust-verify=on", "--crate-type=lib", "--edition", "2021", "--emit=metadata"]

# Seventy-one one-line programs a person writes without thinking about
# verification, in ten categories. Each file is one `b <category> <name>` row of
# the script: its quoted source and a newline, at <category>/<name>.rs. Every
# case is to verify but the two the script names as correct refusals: a user
# `Display` or `Debug` impl writes through a `Formatter` whose writer the caller
# chose, and an allowance that made them pass was retired as a false proof.
[[corpus]]
id = "bench"
pin = "verifies"
pins = { "fmt/m3" = "refuses", "fmt/m4" = "refuses" }

[[corpus.group]]
glob = "tests/daily-driver-bench/*/*.rs"
ids_under = "tests/daily-driver-bench"
args = ["--edition", "2021", "--crate-type", "lib"]

# The findings of 2026-09-18 as rows: ordinary multi-function programs, and the
# Lean half (a `clean { }` island in a Rust file). A row pinned `refuses` that
# starts verifying is as much a regression as one pinned `verifies` that stops.
[[corpus]]
id = "probes"
glob = "tests/daily-driver-realistic/*.rs"
args = ["--crate-type=lib", "--edition", "2024"]
pin = "verifies"

[corpus.pins]
derive_hash_alone = "refuses"
false_theorem_must_be_rejected = "refuses"
loop_accumulator_correct_refusal_bounded_addend_really_overflows = "refuses"
loop_accumulator_correct_refusal_unbounded_addend = "refuses"
loop_accumulator_unbounded_n_is_safe_but_refused = "refuses"
loop_bottom_tested_max_bound_must_refuse = "refuses"
loop_bottom_tested_unbounded_must_refuse = "refuses"
loop_counter_over_a_zst_slice_iter_must_refuse = "refuses"
loop_counter_over_a_zst_slice_must_refuse = "refuses"
mathlib_proof_must_be_refused = "refuses"
opendispatch_closure_call = "refuses"
opendispatch_generic_static = "conditional"
opendispatch_trait_dyn_single = "refuses"
p4 = "refuses"
p5 = "refuses"
sysroot_at_user_type_behind_a_helper_must_refuse = "refuses"
sysroot_generic_over_user_ord_behind_a_helper_must_refuse = "refuses"

[corpus.conditional]
disclosure = 'recorded as `assumption:instance-hypothesis` (skipped, NOT proved)'
certify_args = ["-Ztrust-policy=certify"]
certify_refusal = "Trust certify verification failed"

[[corpus.group]]
glob = "tests/daily-driver-realistic/lean/*.rs"
args = ["-Z", "trust-verify=off", "--crate-type=lib", "--edition", "2021"]

# The open-dispatch ladder: each file records the disposition it was measured
# at, in its own `//@ trust-ladder…:` lines. The cross-crate rows are built
# against the crates of xcrate/lib*.rs, each of which must build on its own.
[[corpus]]
id = "ladder"

[corpus.conditional]
disclosure = 'recorded as `assumption:instance-hypothesis` (skipped, NOT proved)'
certify_args = ["-Ztrust-policy=certify"]
certify_refusal = "Trust certify verification failed"

[[corpus.group]]
glob = "tests/open-dispatch-ladder/*.rs"
args = ["--edition", "2021"]
env = { TRUST_VANILLA_DEBUG = "1" }
headers = "trust-ladder"

[[corpus.group]]
glob = "tests/open-dispatch-ladder/xcrate/user_*.rs"
ids_under = "tests/open-dispatch-ladder"
args = ["--edition", "2021"]
headers = "trust-ladder-xcrate"
dependencies = "tests/open-dispatch-ladder/xcrate/lib*.rs"
dependency_args = ["--edition", "2021", "--crate-type=lib", "-Zalways-encode-mir"]
