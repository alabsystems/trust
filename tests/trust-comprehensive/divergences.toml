owner = "@trust-release"
reason = "RESOLVED 2026-08-29 BY MEASUREMENT AND FIX. The rustdoc-ui suite under --trust-vanilla on a stage2 built from 7a8214546 was measured for the first time: 385 passed / 12 failed / 7 ignored. Every failure was triaged individually and adversarially reviewed: two fork DEFECTS were fixed at the source with `// Trust:` markers — the initial-commit rebrand had renamed the LANGUAGE to `Trust code` in rustdoc's invalid_rust_codeblocks lint (3 tests, which also carry a legitimate `error from trustc:` tool-name rebrand, ledgered), and had dropped the issue URL in collect_intra_doc_links' malformed-generics note (1 test, source-only); 10 tests carried STATIC rebrands (tool names, Trust-owned doc prose, Trust's ICE tracker URL) and are ledgered per test in tests/upstream-rust/patches.toml (13 rows) with the replace text applied on disk; 1 (scrape-examples) was already covered by the trust_docs_reference_notes adapter rule and only lacked the on-disk half. One INVOCATION-DERIVED surface (rustdoc's `--passes list` headers) is folded for comparison by compiletest rule (e), scoped to this suite. After: vanilla 397 passed / 0 failed / 7 ignored AND branded 397 / 0 / 7 on the same snapshot. The linkcheck half was retired 2026-07-30 as unproducible in any standard Trust build (`docs = false`)."
issue = "local:reports/artifacts/2026-08-29-rustdoc-ui-lanes.log"
reviewed_on = "2026-08-29"
note = "2026-08-29: the seventh review and the first to run the suite; the 07-30 note's demand — carry the suite run or retire the row — is met by both. What the measurement showed about the row's own claim: the drift was real (12 tests) but NONE of it was `rustdoc OUTPUT drift` in the sense of behaviour — every diff was a string the fork itself had rebranded and never ledgered, plus one URL it had dropped. Going forward a new rustdoc-ui divergence gets a per-test patches.toml row (STATIC), a compiletest comparison rule scoped to the suite (INVOCATION-DERIVED), or a source fix (DEFECT) per docs/UPSTREAM_DIVERGENCE_POLICY.md; this category row is not reopened."
allowed_exit_codes = [0]
allowed_patterns = [
    "test result: ok. 397 passed; 0 failed; 7 ignored",
]
