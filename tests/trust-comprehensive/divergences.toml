# Command-level divergence ledger for tests/run_trust_comprehensive_harness.sh.
#
# This ledger is intentionally empty by default. The full upstream Rust corpus
# uses tests/upstream-rust/test-exceptions.toml for per-test exceptions, and the
# Trust-added compiletest corpus uses tests/trust-added/compiletest-exceptions.toml.
#
# A row here documents that a top-level harness gate is known to diverge. It
# does not make the comprehensive replacement verdict pass; documented
# divergences are still reported as blockers unless the caller is doing local
# triage outside release evidence.

schema_version = "0.1.0"

# Example shape:
#
# [[divergences]]
# id = "divergence.example"
# gate_id = "upstream.porting"
# status = "active"
# owner = "@trust-release"
# reason = "Short, falsifiable reason."
# issue = "https://example.invalid/trust/issues/123"
# reviewed_on = "2026-05-06"
# expires_on = "2026-06-06"
# allowed_exit_codes = [1]
# allowed_patterns = ["specific failure text required in the gate log"]

[[divergences]]
id = "upstream.trust-compat.2026-05-07.ui-diagnostic-drift"
gate_id = "upstream.trust-compat"
status = "accepted_narrow_divergence"
owner = "@trust-release"
reason = "RESOLVED to an explicit porter model: the tests/ui vanilla lane is GREEN (21159 passed / 0 failed / 606 ignored, exit 0). Trust's deliberate branding and prose are represented directly in the reviewed in-tree tests/ui expectations; structural/non-branding deviations remain enumerated in tests/upstream-rust/patches.toml. Compiletest only normalizes platform/path classes that the porter does not encode. The in-tree expectation set is therefore an audited Trust adapter, not a pristine upstream mirror."
issue = "local:reports/trust-comprehensive/upstream.trust-compat"
reviewed_on = "2026-07-11"
expires_on = "2026-10-01"
note = "2026-07-11 policy reconciliation: porter commit 9d808e84011 moved branded explain hints, ICE notes, and Trust documentation prose into the in-tree UI expectations and removed TRUST_WORDING_NORMALIZATIONS from compiletest. The large expectation rewrite is intentional adapter data, not blind bless output. The upstream Rust baseline remains recoverable from its recorded import commit; Trust release evidence reviews the adapter diff plus patches.toml rather than claiming byte-for-byte-pristine upstream expectations."
allowed_exit_codes = [0]
allowed_patterns = [
    "test result: ok. 21159 passed; 0 failed; 606 ignored; 0 measured; 0 filtered out",
]
classification = "diagnostic_drift"
compatibility_status = "accepted_narrow_divergence"
required_action = "Keep the lane green and auditable: a new Trust diagnostic rewrite must include the compiler change and its narrowly matching adapter expectation; structural/non-branding divergence must also update patches.toml. Never run a broad unreviewed bless or hide branded differences in compiletest normalization."

