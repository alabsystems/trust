# RETIRED 2026-08-23, one day after filing: the quarantine
# "scoped.compiler-check.2026-08-22.trust-mc-driver-artifact-privacy" is deleted
# because its SUBJECT IS FIXED, not because it expired.
#
# Its diagnosis was right — trust-mc-driver read ChcProofRunArtifact/ProofRun
# fields that trust-mc-core had made private behind accessors. Its REASON for
# filing was wrong. It said "the trust-mc lane is ACTIVE and owns the
# reconciliation; racing it risks colliding with in-flight work." Measured the
# next day: they had ALREADY LANDED IT. trust-mc's own origin/main read
# `artifact.schema()` at 4320d34a7, and our gitlink simply pointed one commit
# earlier. Nothing was in flight; a pointer was stale.
#
# Advancing the pin (a lossless fast-forward) cleared all 15 errors and exposed
# two consumer updates that belong with any pin move — trust-bmc's `.result` ->
# `.result()`, and a pre-existing trust-mir-extract test-initializer skew the
# earlier failure had been masking.
#
# `scripts/check_compiler_targets_build.sh` now exits 0 with NO waiver in
# effect: 412 crates compiled, 0 errors, 8m32s, "compiler and its test targets
# check clean".
#
# The general rule, now three-for-three in two days: BEFORE quarantining a
# submodule breakage, run `git -C first-party/<mod> show origin/main:<file>`.
# If upstream already reads the way rustc is suggesting, the code is fine and
# the PIN is stale — and a waiver would suppress the gate for a week over
# something already fixed.
