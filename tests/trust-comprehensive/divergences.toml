[[divergences]]
id = "verify.precision.2026-07-08.call-havoc-guard-severing"
gate_id = "verify.precision"
status = "active"
owner = "@trust-release"
reason = "SOUNDNESS FIX (callee-write false-accept sweep): a guard read of a pointee (`*r`, `s.v` behind &mut) no longer transfers across ANY Call/Drop/Opaque terminator — the conservative havoc severs guard-to-use fact flow when a call/drop sits between a pointee guard and its arithmetic use, flipping previously-PROVING safe idioms to REFUTE: println!/logging between guard and use, unrelated calls with disjoint arguments, &self getters inside &mut-self methods, provably-disjoint-&mut-arg calls (probes or1_println, or1_unrelated, or2_disjoint, or2_unrelated, or3_self, or3_self_getter, or4_println, or5_div, or7_vec). ACCEPTED per the sacred invariant: the same havoc closes a CONFIRMED silent false-accept (guard `*r < 1000`, callee writes `*r = u32::MAX`, use `*r + 1` verified '1 proved' yet panicking at runtime) plus its method/nested/field/mem-replace/mem-swap/Drop-glue variants. The snapshot idiom (`let n = *r;` before the call) remains a zero-cost sound rewrite and PROVES (or6_snapshot control). SCOPE NARROWED (per-argument havoc refinement, same day): calls whose arguments are ALL constants or copies of pure pointer-free values — and whose function contains no raw-pointer laundering site — no longer sever the guard (or1_unrelated, or2_unrelated, or5_div restored CLEAN). Still severed pending the deeper lanes: pointer-carrying args incl. fmt closures (or1/or4_println), place-level disjoint &mut args (or2_disjoint, or7_vec), and &self getters inside &mut-self methods (or3_self, or3_self_getter)."
issue = "local:task#14-callee-write-false-accept"
reviewed_on = "2026-07-08"
expires_on = "2026-10-08"
allowed_exit_codes = [1]
allowed_patterns = [
    "overflow:add",
    "overflow:sub",
]
classification = "precision_regression_from_soundness_fix"
compatibility_status = "accepted_narrow_divergence"
required_action = "Precision follow-ups scheduled BEHIND the soundness fix, never as a rollback: (a) per-argument reachability refinement (skip havocing pointees no call argument can reach — sound under &mut noalias), (b) arg-pointee non-mutation callee summaries in modular.rs (currently dest-only), (c) wire the snapshot rewrite into trust-backprop so the flywheel auto-repairs regressed sites."

