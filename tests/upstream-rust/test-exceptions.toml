# RETIREMENT, 2026-08-10 — 71 `*.sysroot-skew` rows deleted, not renewed.
#
# All 71 carried one byte-identical `reason` about the ui-fulldeps rustc-private
# sysroot being assembled incoherently (E0463/E0460 on `extern crate rustc_*`),
# sourced to domination run `exec-c30dc44143` (2026-07-12).
#
# THE DEFECT WAS FIXED THIRTEEN DAYS BEFORE THE ROWS WERE WRITTEN. Commit
# `94446ac500` (2026-07-11) re-provided the pruned rustc_private crates with
# `-Lall=` instead of `-Ldependency=`: `PathKind::Dependency` does not match the
# `Crate`-kind load a direct `extern crate rustc_span;` performs, so the crates
# were on disk but unfindable. Its own message names two of these very tests as
# verified passing.
#
# The rows survived because their evidence anchor is a STALE BRANCH:
#     git merge-base --is-ancestor 94446ac500 c30dc4414365   -> NO
#     git show c30dc4414365:src/bootstrap/.../test.rs | grep -c 'Ldependency='  -> 2
#     HEAD: grep -c 'Lall=' src/bootstrap/.../test.rs                          -> 2
# The 2026-07-24 decomposition minted 71 per-test rows from an already-superseded
# artifact without re-running anything.
#
# RETIRED ON A REAL LANE RUN, with its positive control:
#     x.py test --stage 2 tests/ui-fulldeps
#     2x "NOTE: verified rustc_private sysroot for ui-fulldeps (...)"  <- control
#     running 76 tests; 73 passed; 0 FAILED; 3 ignored
# (`verify_rustc_private_sysroot_dirs` panics if the prepared dirs are missing or
# lack librustc_span/librustc_data_structures/libhashbrown, so those two NOTE
# lines are proof the fulldeps lane actually ran on coherent dirs rather than
# being skipped.) Log: reports/artifacts/2026-08-10-ui-fulldeps-lane.log
#
# ZERO failures means no row in this suite is currently justified — a row exists
# to waive a failure. Deleted rather than marked `status = "resolved"`, because
# nothing in crates/trust-upstream-compat ever reports an exception that covered
# no failure (`failure_covering_exception` only ever ASKS whether a row covers
# one), so a stale row stays invisible until its expiry fires. Any test that
# genuinely fails later gets a NEW row with its actual diff text.
#
# Per-test exception ledger for `trust-upstream-compat prove`.
#
# Release evidence may only accept a vanilla upstream Rust failure, skip, or
# output diff when a matching active entry appears here. Keep entries narrow:
# one test id, one suite/path/revision, one owner, one issue, and one expiry.

