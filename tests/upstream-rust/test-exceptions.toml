# Per-test exception ledger for `trust-upstream-compat prove`.
#
# Release evidence may only accept a vanilla upstream Rust failure, skip, or
# output diff when a matching active entry appears here. Keep entries narrow:
# one test id, one suite/path/revision, one owner, one issue, and one expiry.

schema_version = "0.1.0"

# RETIRED 2026-07-23: `test-exc.crashes.135122.no-ice` removed. The exception was
# already `status=resolved`, and its subject `tests/crashes/135122.rs` is DELETED
# (replaced by tests/ui/implied-bounds/ice-implied-outlives-bounds-135122.rs, which
# asserts the ordinary diagnostics Trust emits where upstream still ICEs at
# `assertion failed: !ty.has_non_region_infer()` in implied_outlives_bounds).
# Nothing remains for the waiver to match. The adopted-fix rationale is permanently
# recorded in tests/upstream-rust/upstream-fixes.toml
# (fix.trait_solver.implied_outlives_bounds_infer_ice_135122). Verified deleted +
# replacement present + fix-record present before removal.

[[exceptions]]
id = "test-exc.lexer.str-as-char-4.prime-superset"
test_id = "upstream.tests.ui.lexer.lex-bad-str-literal-as-char-4.rs"
suite = "ui"
path = "tests/ui/lexer/lex-bad-str-literal-as-char-4.rs"
revision = "rust-lang/rust:5e91de65d75d3c849c643f5079509b9e5985a5c0"
kind = "intentional_divergence"
status = "active"
owner = "@trust-compiler"
reason = "Post-state prime notation (two-language design D2/Q9) makes ident-adjacent quotes that are neither char literals nor lifetimes lex as prime tokens. The single-quoted string inside this UNEXPANDED macro body therefore lexes cleanly and the program compiles: an invalid-vanilla program admitted by the superset grammar, exactly like clause positions. Expanded uses still error at parse time."
issue = "local:docs/design/2026-07-09-two-language-spec-surface.md#11-open-questions"
reviewed_on = "2026-07-11"
expires_on = "2026-10-09"
allowed_patterns = [
    "unused macro definition",
    "compiled successfully where upstream expects unterminated character literal",
]

[[exceptions]]
id = "test-exc.lexer.str-as-char-3.prime-superset"
test_id = "upstream.tests.ui.lexer.lex-bad-str-literal-as-char-3.rs"
suite = "ui"
path = "tests/ui/lexer/lex-bad-str-literal-as-char-3.rs"
revision = "rust-lang/rust:5e91de65d75d3c849c643f5079509b9e5985a5c0"
kind = "intentional_divergence"
status = "active"
owner = "@trust-compiler"
reason = "Companion to lex-bad-str-literal-as-char-4: post-state prime notation (two-language design D2/Q9) lexes the ident-adjacent single quote in `println!('hello world')` as a prime token rather than an unterminated char literal, so Trust emits label/prime parse diagnostics across all three edition revisions instead of upstream's 'unterminated character literal' + 'unknown prefix `world`'. Same intentional superset-grammar divergence; the invalid-vanilla program is still rejected, only the diagnostic text differs."
issue = "local:docs/design/2026-07-09-two-language-spec-surface.md#11-open-questions"
reviewed_on = "2026-07-12"
expires_on = "2026-10-09"
allowed_patterns = [
    "expected `while`, `for`, `loop` or `{` after a label",
    "prime token diagnostics replace the upstream unterminated character literal error",
]

