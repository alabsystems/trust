# Per-test exception ledger for `trust-upstream-compat prove`.
#
# Release evidence may only accept a vanilla upstream Rust failure, skip, or
# output diff when a matching active entry appears here. Keep entries narrow:
# one test id, one suite/path/revision, one owner, one issue, and one expiry.
#
# A row exists to waive a failure: delete it once its test passes. Nothing in
# crates/trust-upstream-compat reports a row that covers no failure
# (`failure_covering_exception` only asks whether a row covers one), so a stale
# row stays invisible until its expiry fires.

schema_version = "0.1.0"

# LANE IS REQUIRED. Every active row here must declare the compiletest lane(s)
# its failure was observed on — "vanilla" (--trust-vanilla), "default" (no lane
# flag) or "verified" (--trust-verified). The assignment lives in the sibling
# `test-exception-lanes.toml` and is enforced by `check_exception_lanes.py`,
# which FAILS on a row with no assignment. It is a sidecar rather than a field
# on this row only because `TestException` in
# crates/trust-upstream-compat/src/model.rs is `deny_unknown_fields`, so an
# inline `lane =` key would make this whole ledger unparseable and take the
# release gate down with it; the fold-in migration is written out at the top of
# the sidecar. Rationale, the measured premise that no verified lane exists yet,
# and the runbook for building one: VERIFIED-LANE-RUNBOOK.md.
#
# ADDING A ROW: add the [[exceptions]] row here AND the [[lanes]] row there, in
# the same commit. A row with no lane assignment fails the gate; that is the
# point — before this, one undifferentiated row could be cited by a vanilla run
# or a verified one, so a vanilla waiver could silently net a verified failure.

