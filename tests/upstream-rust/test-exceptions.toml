[[exceptions]]
id = "test-exc.tait.65679-free-alias-mir-built-cycle"
test_id = "upstream.tests.ui.type-alias-impl-trait.issue-65679-inst-opaque-ty-from-val-twice.rs"
suite = "ui"
path = "tests/ui/type-alias-impl-trait/issue-65679-inst-opaque-ty-from-val-twice.rs"
revision = "rust-lang/rust:5e91de65d75d3c849c643f5079509b9e5985a5c0"
kind = "expected_fail"
status = "active"
owner = "@trust-compiler"
reason = "Trust-introduced query cycle, NOT a diagnostic drift: this `//@ check-pass` test aborts with `error[E0391]: cycle detected when computing type of T::{opaque#0}`. Vanilla rustc 1.99.0-nightly (14cae6813) compiles it clean. CORRECTED 2026-07-30 — the 2026-07-25 text stated its evidence backwards TWICE and pointed at a line that had drifted. (a) It said `--emit=metadata` alone exits 0 and the failure therefore comes through `optimized_mir`. Re-measured: `--emit=metadata` FAILS, and the compiler prints the path itself — `borrow-checking bop -> promoting constants in MIR for bop -> checking if bop contains FFI-unwind calls -> building MIR for bop -> normalizing fn() -> T`. It is BORROWCK, reached through the `mir_built` hook at compiler/rustc_mir_build/src/builder/mod.rs, not codegen. (b) The `cycle_safe_normalize` citation `lib.rs:16129` is stale; the function is at crates/trust-thir-lower/src/lib.rs:17378 and its guard at :17386. MECHANISM (unchanged and confirmed): `type T = impl Sized;` is a TAIT, so uses lower to `ty::Alias(Free, T)`, which sets HAS_TY_FREE_ALIAS and NOT HAS_TY_OPAQUE. The `has_opaque_types()` guard therefore does not see it, and `try_normalize_erasing_regions` under `TypingEnv::fully_monomorphized()` (a REVEALING mode) demands `type_of_opaque` -> `mir_borrowck` -> `mir_built`, the query already in flight. TWO REPAIRS ARE NOW DISQUALIFIED, both recorded so neither is retried: (1) widening the guard to `has_aliases()` — it also stops resolving concrete projections, which is the identity-vs-concrete asymmetry the wave-19 DST-coherence gate reads to catch a thin-vs-fat pointer flip, so it could admit a fat value into a thin record slot; (2) returning `FatShape::Opaque` for an alias under `reveal_unsafe` — proposed and REFUTED 2026-07-30 by adversarial review, because three sites NEGATE `is_pure_value_shape` (lib.rs:3632 and :6504 among them) and would flip from DECLINE to ADMIT, e.g. the for-desugar arm whose in-tree comment states that a pure-value shape MUST fail closed. Both are soundness changes to gates that need their own evidence, not flag swaps. Retire this row when that evidence exists; do not retire it by widening the guard."
issue = "local:crates/trust-thir-lower/src/differential.rs#opaque-reveal-cycle-gate"
reviewed_on = "2026-07-25"
expires_on = "2026-09-25"
allowed_patterns = [
    "cycle detected when computing type of",
]
