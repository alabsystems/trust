# Structured upstream Rust compatibility divergence audit.
#
# This file separates accepted upstream-test divergences from blockers and
# Trust-added proof debt. It does not make any gate pass. Release evidence must
# still come from `targo trust domination upstream-tests` on the reviewed
# commit with zero unaccounted failures.

