[[items]]
id = "upstream.adapter.cargo-transparent-proxy-exec.tools"
scope = "upstream-cargo"
status = "active"
owner = "@trust-release"
reviewed_on = "2026-10-24"
expires_on = "2026-11-23"
classification = "manual-harness-adapter"
compatibility_status = "changed_fixture_coverage_no_failure_waiver"
suite = "cargo-testsuite"
path = "src/tools/targo/tests/testsuite/utils/tools.rs"
issue = "local:docs/DECISION_QUEUE.md#targo-transparent-proxy-handoff-1-2026-10-24"
reason = "echo_wrapper and wrapped_clippy_driver: SP-1 strips unnamed descriptors across spawn. These single-threaded transparent fixtures explicitly exec the requested program on Unix, preserving the already parent-bounded table without reading MAKEFLAGS or opting into global inheritance. Arguments, output assertions and payload checks stay intact; non-Unix retains the original spawn/status path."
compatibility_impact = "Changed coverage: Unix no longer tests implicit inheritance across a second plain spawn or its post-wait status conversion; exec propagates tool result/signals directly. This is not upstream spawn parity, a production compiler change or a failure waiver. Root patches.toml cannot apply src/tools/targo paths; this is an explicit manual adapter record only."
required_action = "Re-review the exact adapter and full affected Cargo modules before expiry or if SP-1/upstream proxy behavior changes. Preserve plain/empty-pre_exec noninheritance negatives, first-hop sentinel exclusion and one-token roundtrip. Retire when this handoff needs no adaptation; no renewal from stale receipts."

