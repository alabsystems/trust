local_artifact = "src/librustdoc; tests/rustdoc; tests/rustdoc-ui; tests/rustdoc-json; tests/rustdoc-js"
status = "unknown"
labels = ["upstream-rust", "toolchain", "rustdoc", "release-blocking"]

[entries.expectation]
upstream_behavior = "upstream rustdoc renders documentation, diagnostics, JSON output, search index data, and doctest wiring for the adopted snapshot"
local_behavior = "tRust rustdoc in vanilla mode renders and reports the same externally visible behavior"
compatibility_rule = "host-applicable upstream rustdoc suites must pass with matching output, diagnostics, and emitted artifacts unless ledger-accounted"

