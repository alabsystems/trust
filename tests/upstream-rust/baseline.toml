# Production-shaped seed baseline for upstream Rust compatibility accounting.
# This file follows crates/trust-upstream-compat schema_version 0.1.0.

schema_version = "0.1.0"
id = "upstream-rust.toolchain-baseline.2026-07-09"

[upstream]
channel = "nightly"
# Trust: re-pinned by the rust-1.96->1.99 content migration (branch
# migrate/rust-2026-07): compiler/, library/, src/, and tests/ are ported to
# this revision (3-way against the previous pin 0d4eb098). The per-surface
# statuses below remain the honest seed state until a full domination
# scorecard runs against THIS revision — the tests/ui vanilla replay evidence
# (20779/393/593, 2026-07-09) lives in tests/trust-comprehensive/
# divergences.toml#ui-diagnostic-drift, not here.
revision = "rust-lang/rust:5e91de65d75d3c849c643f5079509b9e5985a5c0"
snapshot_date = "2026-07-08"

[local]
revision = "trust:migrate/rust-2026-07"
branch = "migrate/rust-2026-07"
workspace = "tRust"

# Trust: how to populate the 13 surface `status` fields below.
#
# Every entry currently carries `status = "unknown"` — i.e. "not yet
# classified". These are seed placeholders, NOT a claim of compatibility.
# Do NOT hand-edit them to "compatible"/"diverged" from intuition; that
# would fabricate a drop-in-parity claim. Each value must come from a real
# stage2 scorecard run against the pinned [upstream] revision above.
#
# Valid values are exactly the BaselineStatus enum
# (crates/trust-upstream-compat/src/model.rs, serde snake_case):
#   compatible       local behavior matches upstream for the surface
#   diverged         local behavior differs (must be ledger-accounted)
#   missing_local    upstream surface exists, no local support yet
#   missing_upstream local surface exists, upstream anchor is gone
#   unknown          not yet classified (the current seed state)
#
# Procedure to populate honestly:
#   1. Build a coherent stage2 vanilla Trust sysroot (./x.py build --stage 2),
#      then run the canonical scorecard for the adopted baseline revision:
#        targo trust domination upstream-tests --release --proof-mode full \
#          --upstream-revision rust-lang/rust:5e91de65d75d3c849c643f5079509b9e5985a5c0 \
#          --out-dir reports/upstream-rust/<run-id>/adopted_baseline_release_full
#      (see scripts/run_upstream_rust_adopted_evidence.py:full_suite_commands).
#   2. Read the emitted scorecard.json. Per-surface outcomes there map onto a
#      BaselineStatus: an all-passing surface (or one whose only failures are
#      covered by active tests/upstream-rust/test-exceptions.toml rows) becomes
#      `compatible`; a surface with unaccounted failures becomes `diverged` and
#      requires a ledger entry before any release claim; absent upstream/local
#      anchors map to `missing_upstream`/`missing_local`.
#   3. Bump `id` (date suffix) and refresh [upstream]/[local] revisions if the
#      run pinned different commits, then commit the scorecard alongside as the
#      evidence backing each status. Until a run exists, leave these `unknown`.

[[entries]]
id = "toolchain.rustc"
title = "rustc compiler compatibility"
surface = "cli"
upstream_artifact = "compiler/rustc_driver; compiler/rustc_interface; tests/ui; tests/codegen; tests/incremental; tests/crashes"
local_artifact = "compiler/rustc_driver; compiler/rustc_interface; tests/ui; tests/codegen; tests/incremental; tests/crashes"
status = "unknown"
labels = ["upstream-rust", "toolchain", "rustc", "release-blocking"]

[entries.expectation]
upstream_behavior = "upstream rustc accepts the upstream command-line contract, diagnostics, codegen behavior, and suite metadata for the adopted snapshot"
local_behavior = "tRust stage2 compiler in vanilla mode accepts the same contract without Trust-only verification effects"
compatibility_rule = "host-applicable upstream rustc suites and command-line behaviors must match unless a result is accounted for by an active exception or tracked upstream fix"

