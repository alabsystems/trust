# Trust-ahead-of-upstream divergence adopted as a fix (2026-07-12), not an
# upstream commit: rust-lang/rust#135122 still ICEs at the tracked revision
# (`assertion failed: !ty.has_non_region_infer()` in implied_outlives_bounds
# during impl-item comparison; upstream keeps it in the known-bug corpus as
# tests/crashes/135122.rs, labeled fixed-by-next-solver, issue open). Trust
# emits ordinary diagnostics (E0046/E0207/E0191/E0277) instead of crashing,
# observed in domination run exec-c30dc44143. Per the upstream-sanctioned
# process for a crashes test that stops ICEing, the crashes entry is deleted
# locally and replaced by the blessed regression test
# tests/ui/implied-bounds/ice-implied-outlives-bounds-135122.rs. The matching
# waiver test-exc.crashes.135122.no-ice in test-exceptions.toml is resolved
# (local_action = drop_exception). status = "proposed" because the upstream
# fix path (next-generation trait solver) has not landed as default upstream.
[[fixes]]
id = "fix.trait_solver.implied_outlives_bounds_infer_ice_135122"
baseline_entry_id = "toolchain.rustc"
title = "implied-outlives-bounds infer-var ICE (crashes/135122) emits ordinary diagnostics under Trust"
upstream_reference = "https://github.com/rust-lang/rust/issues/135122"
status = "proposed"
local_action = "drop_exception"
