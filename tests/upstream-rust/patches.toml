# The post-pin Span-niche port. 0b291f30a3 (PERF-NOV26-SPAN-NICHE-TRIVIAL-CONST-1)
# ported upstream #164291 ahead of the cabb1ea4 pin: `Span` gained a niche, so
# every `Option<Span>` field shrank 16 -> 8 bytes and the compiler's own
# static_assert_size! pins moved (ast `Item` 144 -> 136, `Local` 96 -> 88). The
# port re-blessed tests/ui/stats/input-stats.stderr but left these rows out, so
# reversing the ledger no longer recovered the pinned upstream bytes (crates red
# measured on main e792e5a6cd, 2026-11-09). Upstream's file at the pin AND at
# rust-lang/rust main fetched 2026-11-10 is byte-identical to the
# porting_expectation_tests oracle (sha256 fc5e0b71...), still 144/96/80. Retire
# these three rows, and drop the Span-niche share of the two Total rows, the
# moment the pin moves past an upstream expectation that carries #164291.

