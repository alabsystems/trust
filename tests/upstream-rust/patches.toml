[[patches]]
id = "trust.naming.run-make-version-prefix"
status = "active"
owner = "@trust-release"
reason = "RESCOPED 2026-08-29. The original premise was wrong: the version line's leading token is `rustc` in BOTH toolchains and always was -- deliberately, because build scripts machine-parse it. What actually diverges is a trailing IDENTITY parenthetical, ` (trustc <ver>)`, which upstream does not emit. Suppressing it under RUSTC_OVERRIDE_VERSION_STRING was implemented and REVERTED: that variable overrides the VERSION, while the parenthetical is the tool's identity, and since the variable is settable by anyone in the environment, honouring it there would hand out a verifying compiler reporting as stock rustc. With the leading token hardcoded to `rustc` and the version operator-supplied, the parenthetical is the last remaining signal of what the binary is. The test therefore parses it off, asserts the overridden version verbatim, AND asserts the identity is still present -- lane-aware: under `--trust-vanilla` the wrapper is not named `trustc`, so an absent parenthetical is accepted there and only there. RE-ANCHORED 2026-09-27: the row's `replace` had not followed 0375f48809's lane-aware `match brand` (it occurred 0 times on disk, so a re-import would have dropped the vanilla branch); `find` now spans both pristine lines so the re-applied file is byte-identical to the checked-in one, `// Trust:` comments included."
issue = "local:docs/UPSTREAM_DIVERGENCE_POLICY.md#reasonable-divergences"
reviewed_on = "2026-09-27"
expires_on = "2026-11-29"
path = "tests/run-make/version-check/rmake.rs"
kind = "string-replace"
find = '''
    let version = rustc_out.strip_prefix("rustc ").unwrap().trim_end();
    assert_eq!(version, signalled_version);'''
replace = '''
    // Trust: `-V` leads with the canonical `rustc ` token, not the Trust alias —
    // the leading token is a machine-parsed contract for build scripts (see
    // rustc_driver_impl's version printer). The Trust binary identity rides the
    // trailing parenthetical and the verbose `binary:` / `trust:` lines.
    let version = rustc_out.strip_prefix("rustc ").unwrap().trim_end();

    // Trust: the override sets the VERSION; it does not and must not suppress
    // the tool's IDENTITY. `RUSTC_OVERRIDE_VERSION_STRING` is settable by anyone
    // in the environment, so honouring it for the identity parenthetical would
    // hand out a verifying compiler that reports as stock rustc — and with the
    // leading token already the hardcoded compat `rustc` and the version already
    // operator-supplied, that parenthetical is the LAST signal of what this
    // binary is. Suppressing it was implemented, measured, and reverted.
    //
    // The brand is keyed on the INVOKED name (`trust_display_binary`), so it is
    // empty under `--trust-vanilla`, whose wrapper is not called `trustc` and
    // which exists to reproduce upstream output byte-for-byte. Require the
    // identity only on the lane that should be emitting it.
    let vanilla = std::env::var_os("__COMPILETEST_TRUST_VANILLA_REAL_RUSTC").is_some();
    let (version, brand) = match version.split_once(" (") {
        Some((version, brand)) => (version, Some(brand.trim_end_matches(')'))),
        None => (version, None),
    };
    assert_eq!(version, signalled_version, "the overridden version must be reported verbatim");
    match brand {
        Some(brand) => assert!(
            brand.starts_with("trustc "),
            "identity parenthetical must name the Trust driver, got `{brand}`"
        ),
        None => assert!(
            vanilla,
            "Trust dropped its identity under RUSTC_OVERRIDE_VERSION_STRING: a compiler that \
             reports as stock rustc whenever an env var is set has made its own provenance \
             settable"
        ),
    }'''
expected_replacements = 1
allow_missing = false

