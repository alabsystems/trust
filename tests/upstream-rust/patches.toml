[[patches]]
id = "trust.divergence.prime-notation-str-as-char-3-rust2018"
status = "active"
owner = "@trust-compiler"
reason = "Post-state prime notation (two-language design D2/Q9): a quote adjacent to an identifier that forms neither a valid char literal nor a lifetime now lexes as a prime token, so the single-quoted-string typo diagnoses as parse errors after prime lexing instead of an unterminated-char-literal lex fatal. The program is still rejected; wording is Trust-owned. Follow-up: targeted prime-outside-clause diagnostic with the double-quote suggestion."
issue = "local:docs/design/2026-07-09-two-language-spec-surface.md#11-open-questions"
reviewed_on = "2026-07-11"
expires_on = "2026-10-09"
path = "tests/ui/lexer/lex-bad-str-literal-as-char-3.rust2018.stderr"
kind = "string-replace"
find = '''
error[E0762]: unterminated character literal
  --> $DIR/lex-bad-str-literal-as-char-3.rs:6:26
   |
LL |     println!('hello world');
   |                          ^^^
   |
help: if you meant to write a string literal, use double quotes
   |
LL -     println!('hello world');
LL +     println!("hello world");
   |

error: aborting due to 1 previous error

For more information about this error, try `trustc --explain E0762`.
'''
replace = '''
error: expected `while`, `for`, `loop` or `{` after a label
  --> $DIR/lex-bad-str-literal-as-char-3.rs:6:21
   |
LL |     println!('hello world');
   |                     ^^^^^ expected `while`, `for`, `loop` or `{` after a label
   |
help: consider removing the label
   |
LL -     println!('hello world');
LL +     println!(world');
   |

error: labeled expression must be followed by `:`
  --> $DIR/lex-bad-str-literal-as-char-3.rs:6:21
   |
LL |     println!('hello world');
   |              ------ ^^^^^
   |              |
   |              the label
   |
   = note: labels are used before loops and blocks, allowing e.g., `break 'label` to them
help: add `:` after the label
   |
LL |     println!('hello: world');
   |                    +

error: expected `,`, found `'`
  --> $DIR/lex-bad-str-literal-as-char-3.rs:6:26
   |
LL |     println!('hello world');
   |                          ^ expected `,`

error: aborting due to 3 previous errors

'''
expected_replacements = 1
allow_missing = false


