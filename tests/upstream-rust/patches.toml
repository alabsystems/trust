# Deterministic upstream Rust test patch manifest for
# `targo trust domination upstream-tests`.
#
# The porting CLI reapplies this manifest after every upstream refetch/import
# and records every edit in adapter-audit.jsonl. Keep patches narrow, reviewed,
# expiring, and tied to a tracker item. Ordinary Trust regressions belong in
# the compiler/toolchain, not here. True behavioral divergences belong in
# tests/upstream-rust/test-exceptions.toml.

schema_version = "0.1.0"

# Re-reviewed 2026-07-23: the Trust naming adapter rules remain implemented
# and covered by trust-upstream-compat's porting-engine tests; the concrete
# check_abi and version-prefix replacements are present exactly once in the
# adopted tree; and the full vanilla UI lane remains green at its recorded
# 21159/0/606 census. These renewals preserve intentional Trust-owned branding
# and one explicit type disambiguation; they do not admit semantic divergence.

