[[patches]]
id = "trust.naming.run-make-version-prefix"
status = "active"
owner = "@trust-release"
reason = "RESCOPED 2026-08-29. The original premise was wrong: the version line's leading token is `rustc` in BOTH toolchains and always was -- deliberately, because build scripts machine-parse it. What actually diverges is a trailing IDENTITY parenthetical, ` (trustc <ver>)`, which upstream does not emit. Suppressing it under RUSTC_OVERRIDE_VERSION_STRING was implemented and REVERTED: that variable overrides the VERSION, while the parenthetical is the tool's identity, and since the variable is settable by anyone in the environment, honouring it there would hand out a verifying compiler reporting as stock rustc. With the leading token hardcoded to `rustc` and the version operator-supplied, the parenthetical is the last remaining signal of what the binary is. The test therefore parses it off, asserts the overridden version verbatim, AND asserts the identity is still present."
issue = "local:docs/UPSTREAM_DIVERGENCE_POLICY.md#reasonable-divergences"
reviewed_on = "2026-08-29"
expires_on = "2026-11-29"
path = "tests/run-make/version-check/rmake.rs"
kind = "string-replace"
find = "    assert_eq!(version, signalled_version);"
replace = "    let (version, brand) = match version.split_once(\" (\") {\n        Some((version, brand)) => (version, Some(brand.trim_end_matches(')'))),\n        None => (version, None),\n    };\n    assert_eq!(version, signalled_version, \"the overridden version must be reported verbatim\");\n    let brand = brand.expect(\"Trust must still identify itself under RUSTC_OVERRIDE_VERSION_STRING\");\n    assert!(brand.starts_with(\"trustc \"), \"identity parenthetical must name the Trust driver, got `{brand}`\");"
expected_replacements = 1
allow_missing = false

