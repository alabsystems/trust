# 2026-08-23: the `--emit trust-ir` help line. Trust added a first-class
# `TrustIr` variant to the shared `define_output_types!` table
# (compiler/rustc_session/src/config.rs). `EMIT_HELP` (config.rs, UNMODIFIED
# upstream) mechanically renders one `*  <shorthand> - <default_filename>` row
# per variant, so the extra help line is a consequence of the variant, not a
# separate edit to any diagnostic.
#
# WHY THIS IS ACCEPTED RATHER THAN HIDDEN. trust-ir is the canonical universal
# IR (docs/DESIGN_PHILOSOPHY.md#5), so `--emit trust-ir` is meant to be a
# first-class, discoverable user-facing artifact of Trust's own compiler. This
# is Trust advertising its own artifact menu in its own `--emit` listing; it
# changes no program's compilation. Suppressing the row was considered and
# REJECTED because it yields an incoherent CLI: `OutputType::shorthands_display`
# still names `trust-ir` in the "unknown emission type ... expected one of"
# error (measured 2026-08-23: `--emit=bogus` lists `trust-ir`), so `--emit`
# would recommend a type its own help refuses to list. Undiscoverable-but-
# recommended is worse than one extra help line. Same shape as
# `trust.divergence.check-cfg-trustverify-well-known-names`.
#
# THREE files carry this one divergence. Only the ui .stderr surfaced in the
# 2026-08-23 run because the run-make suite was not reached; the two
# rustc-help expectations fail identically the moment it is. They are ledgered
# together so the same divergence does not resurface as a "new" failure.
#
# OPEN, DELIBERATELY NOT DECIDED HERE (needs owner): `--emit trust-ir` is
# currently UNGATED, i.e. visible and usable without `-Zunstable-options`,
# unlike `thin-link-bitcode` which is gated in `parse_output_types` yet still
# listed in this same help text. Gating it would NOT remove the help row and so
# does not change these three patches either way, but it is a real surface-
# stability question for a `channel="trust"` compiler.

[[patches]]
id = "trust.divergence.emit-help-trust-ir-ui"
status = "active"
owner = "@trust-compiler"
reason = "Trust's first-class `--emit trust-ir` output type (trust-ir is the canonical universal IR, docs/DESIGN_PHILOSOPHY.md#5) appears in the upstream-unmodified EMIT_HELP listing, which renders one row per OutputType variant. CLI/diagnostic surface only: no program compiles differently. Hiding the row was rejected because shorthands_display still recommends `trust-ir` in the unknown-emission-type error."
issue = "local:docs/DESIGN_PHILOSOPHY.md#5-trust-ir-is-the-canonical-universal-ir"
reviewed_on = "2026-08-23"
expires_on = "2026-11-23"
path = "tests/ui/compile-flags/invalid/emit-output-types-without-args.stderr"
kind = "string-replace"
find = '''
                               * thin-link-bitcode - CRATE_NAME.indexing.o
'''
replace = '''
                               * thin-link-bitcode - CRATE_NAME.indexing.o
                               * trust-ir - CRATE_NAME.trust-ir.bin
'''
expected_replacements = 1
allow_missing = false

