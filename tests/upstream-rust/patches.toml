# Deterministic upstream Rust test patch manifest for
# `targo trust domination upstream-tests`.
#
# The porting CLI reapplies this manifest after every upstream refetch/import
# and records every edit in adapter-audit.jsonl. Keep patches narrow, reviewed,
# expiring, and tied to a tracker item. Ordinary Trust regressions belong in
# the compiler/toolchain, not here. True behavioral divergences belong in
# tests/upstream-rust/test-exceptions.toml.

schema_version = "0.1.0"

# Re-reviewed 2026-07-23: the Trust naming adapter rules remain implemented
# and covered by trust-upstream-compat's porting-engine tests; the concrete
# check_abi and version-prefix replacements are present exactly once in the
# adopted tree; and the full vanilla UI lane remains green at its recorded
# 21159/0/606 census. These renewals preserve intentional Trust-owned branding
# and one explicit type disambiguation; they do not admit semantic divergence.

# Re-reviewed 2026-10-09: the 14 trust.naming.* adapter-rule rows below that
# were due 2026-10-23 are renewed to 2027-01-07; each divergence is still present
# and still intended (UPSTREAM_DIVERGENCE_POLICY "Reasonable divergences":
# static Trust-owned names and documentation wording). Checked per rule that
# today's source still emits the Trust form and that installed trustc/trustdoc
# 321aaeda75 prints it, so no upstream test expecting the Rust wording can pass:
#   ice-issue-url, ice-tool-name, ice-toolchain-snapshot, stderr-normalizer:
#     rustc_driver_impl DEFAULT_BUG_REPORT_URL, IceVersion via
#     trust_invoked_binary (default "trustc", also when invoked as `rustc`) and
#     the "latest Trust toolchain snapshot" diag; -Ztreat-err-as-bug prints all
#     three. The 3 tests/ui normalize-stderr lines name `note: trustc`.
#   explain-tool-name, calling-conventions-print-tool-name, asm-labels-docs-note,
#   print-request-docs-help, refutability-docs-note, docs-reference-notes:
#     measured `trustc --explain`, `trustc --print=calling-conventions`, "Trust
#     By Example inline assembly labels", "Trust compiler documentation for
#     `trustc --print`", "Trust Book's refutability section", and the dyn-
#     compatibility and check-cfg notes. Of the rule's 39 docs pairs, every
#     Trust form is in compiler/ or src/tools/tippy and no upstream form is
#     (the higher-ranked note is split across a line continuation); only the
#     `cargo:rustc-link-lib` pair has no test hit today (allow_missing).
#     The 13 remaining `rustc --explain` expectations are exactly the
#     -Zui-testing=no / run-make opt-outs the rule exempts.
#   terminal-error-code-url: annotate_snippet_emitter_writer links the Trust
#     error_codes source; -Zterminal-urls=yes prints it for E0308.
#   rustdoc-{title,gui-title,description}-brand: src/librustdoc
#     render/context.rs appends " - Trust" and "API documentation for the
#     Trust"; trustdoc output measured with both.
# trust.vanilla.check-abi-disambiguate-valid-range is retired the same day
