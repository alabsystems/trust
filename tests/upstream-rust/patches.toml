# DELETE ROWS — upstream paths Trust retires on purpose.
#
# Added 2026-08-23 with the `kind = "delete"` patch kind. Before it existed the
# manifest could not express a deletion, and the `ported-overlay-not-applied`
# validation row was a raw set difference (`upstream_path_set - current_paths`)
# that consulted no ledger. Two decisions this project had already made and
# documented in `divergence-audit.toml` — a file NO CODE READS — therefore
# surfaced as a gate failure whose only offered remedy was `--apply`, which
# would have reverted them: its write phase copies every upstream path
# unconditionally.
#
# An active row here does two things: it removes the path from the imported
# overlay so `--apply` cannot resurrect the test, and it accounts for the path
# in the coverage check. A row that is `status = "inactive"` or expired stops
# doing both, so a stale waiver cannot hold a coverage claim open.

