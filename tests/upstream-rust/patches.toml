# primes are in active use in clauses (DECISION_QUEUE CITE-PRIME-NONASCII-1,
# 2026-10-05). Installed trustc 321aaeda75, whose lexer is identical to this tree,
# emits exactly the 3 replaced errors in all three editions; stock rustc 1.97.1
# emits the upstream E0762 (+ unknown prefix on 2021). These patches stay the
# wrong-reason fix test-exceptions.toml records for str-as-char-3: removing them
# needs the revision-keying gate defect fixed first, and it is still unfixed in
