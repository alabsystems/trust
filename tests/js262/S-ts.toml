# S-ts — the frozen erasable-TypeScript corpus slice for the TrustTS differential lane.
#
# Each path below is a small, import-free, console.log-observable, ERASABLE TypeScript
# program under tests/ts-corpus/ (paths are corpus-relative). Node (>=24, native
# type-strip) and Bun run these `.ts` files natively in the module goal; the TrustTS
# head (trust-ts-strip -> trust-js-interp) is judged against them by
# `trust-js-differential ts-calibrate`. The bar is ZERO wrong traces: a covered trace
# must equal Node or Bun; a sound NoCoverage (strip refusal or interp gap) is always safe.
#
# This is a plain committed list (payload-embedded). `list_sha256` hashes the sorted
# path list; `content_sha256` hashes the sorted-path concatenation of file bytes. Any
# add/remove/edit changes a hash -> drift is detectable.
#
# Author: Andrew Yates
