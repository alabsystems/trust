# Coverage-ratchet ledger for the in-house harness heads (TrustJS M1 D4,
# docs/design/2026-07-21-trustjs-m1-scope.md): per-head covered-run counts
# from recorded gate scorecards. The ratchet is monotone: a landing whose
# scorecard covers FEWER runs than the last entry for that head, or with any
# divergent run, or with equal != covered, fails closed
# (`trust-js-differential ratchet --check`). Entries are appended only from
# `ratchet --propose` output against a committed-evidence scorecard.
#
# Author: Andrew Yates
# Copyright 2026 Andrew Yates | License: MIT OR Apache-2.0

