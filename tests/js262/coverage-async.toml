# TrustJS S-async coverage ratchet — the measured-async slice (M2 D5)
#
# S-async is the S0 rule-set with the async flag REQUIRED (`require_flags=["async"]`):
# 5,401 Test262 cases (list_sha256 46ce5905..., see tests/js262/S-async.toml). Every
# case includes harness/doneprintHandle.js and completes via the deterministic
# microtask/virtual-timer drain in the trace driver; the async completion marker is
# normalized (Test262:AsyncTestComplete / Test262:AsyncTestFailure:<name>, message text
# dropped) so a PASS/FAIL identity — never engine-divergent message prose — is what the
# four heads are compared on.
#
# This ledger ratchets the two IN-HOUSE heads (sem, trustjs), both of which are
# ZERO-DIVERGENT on this slice: every covered case is trace-equal to Node, and every
# uncovered case is a sound NoCoverage refusal (equal == covered). The faithful tier
# NEVER emits a wrong async trace.
#
# HONEST BOUNDARY — the full four-head S-async gate does NOT pass yet
# (gate.pass = false in the scorecard). Node-vs-Bun disagree on 319 of 5,401 cases
# (573 runs; 94.56% trace-equal), and the S-async Node-vs-Bun divergence-audit ledger
# is not yet written, so `unclassified_ok = false`. Those are genuine cross-engine
# `.name` differences (predominantly Node `Error` vs Bun `ResolveMessage` on failed
# dynamic `import()`), NOT in-house bugs. Classifying them into an async
# divergence-audit is the next S-async task; until then this ledger asserts only the
# in-house zero-wrong-traces coverage, and makes no green-gate claim for S-async.
#
# Judged by: trust-js-differential ratchet --scorecard <s-async scorecard> --check
# (the in-house head audits sem_audit_ok / trustjs_audit_ok must hold).

