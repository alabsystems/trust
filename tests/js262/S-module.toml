    "Atomics",
    "SharedArrayBuffer",
    "Temporal",
    "tail-call-optimization",
    "IsHTMLDDA",
    "cross-realm",
    "host-gc-required",
]
exclude_feature_substrings = ["Intl"]
exclude_proposal_features_from = "features.txt#Proposed language features"
exclude_include_content_substrings = ["$262."]

