# tRust-added compiletest exception ledger.
#
# These are not upstream Rust exceptions. They are tRust-added compiletest
# primary files that currently fail the exhaustive `trust-added-compiletest`
# audit. Each active entry is excluded from the intended Rust-native
# `trust-added-compiletest` proof command once ported, so the proof log can
# distinguish "passed" from "known not yet passable" instead of making a false
# all-green claim.
#
# Required metadata for every exception: path, kind, status, owner, issue,
# reviewed_on, expires_on, and reason. Placeholder issues such as
# `#trust-added-compiletest` are invalid; use a real tracker URL or a local
# review-report anchor when GitHub issue filing is unavailable.

schema_version = "0.2.0"

# Empty, and it must stay declared. The validator
# (targo-trust/src/trust_added/mod.rs, `exceptions` lookup) requires this key to
# be present AND an array; deleting the declaration along with the last entry
# fails the ledger's own schema check, which blocks the gate from running at all
# rather than reporting zero exceptions. Removing the final entry means emptying
# this array, not removing it.
exceptions = []


