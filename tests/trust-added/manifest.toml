# tRust-added proof manifest for `trust-upstream-compat prove`.
#
# This file names the canonical tRust-specific test commands that must be
# covered by the per-test inventory/results artifact. The `covers` ids are
# stable inventory ids; the proof validator rejects tRust-added inventory rows
# that are not covered by one of these commands.

schema_version = "0.1.0"

[[commands]]
id = "trust.added.quick"
command = "targo trust domination trust-added --release quick"
covers = ["trust.added.quick"]
required = true

[[commands]]
id = "trust.added.native"
command = "targo trust domination trust-added --release trustc-native"
covers = ["trust.added.native"]
required = true

