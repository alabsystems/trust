# tRust-added proof manifest for `trust-upstream-compat prove`.
#
# TWO SPELLINGS PER ENTRY, and the difference is the strength of the claim.
#
#   `command`        the canonical RELEASE spelling. Always carries `--release`.
#                    Every one of these refuses today: six native modes refuse
#                    the release request outright, and six canonical modes refuse
#                    unconditionally because the evidence they attest to —
#                    authenticated distribution roots, signed artifacts, fresh
#                    receipt transactions, an independently authenticated native
#                    verifier — does not exist yet. See `blocked_canonical_
#                    diagnostic` in targo-trust/src/rust_vs_trust.rs.
#
#   `local_command`  the weaker mode that refusal explicitly names as "runnable
#                    for local diagnostics". A NON-release bundle runs this and
#                    records `release = false`, so it attests what actually ran
#                    at the strength it actually has.
#
# This is NOT a way to make a release bundle pass. A release run uses `command`
# and only `command`; the shape check requires `--release` there and REJECTS it
# in `local_command`, so a bundle can never cite a command at a strength it did
# not execute. `bundle.release` records which lane ran, and the validator's
# release-only rules key on it.
#
# This file names the canonical tRust-specific test commands that must be
# covered by the per-test inventory/results artifact. The `covers` ids are
# stable inventory ids; the proof validator rejects tRust-added inventory rows
# that are not covered by one of these commands.

schema_version = "0.1.0"

[[commands]]
id = "trust.added.quick"
command = "targo trust domination trust-added --release quick"
local_command = "targo trust domination trust-added quick"
covers = ["trust.added.quick"]
required = true

