version = 1

# Reuse annotations file.
#
# This file controls how reuse-tool finds copyright and license notices within
# source files. As the tool has a habit of picking up random uses of the word
# 'Copyright' within source code, and because it will complain that other files
# do not contain any specific copyright and license notifications, we usually
# just set a blanket license and copyright notice for a whole sub-tree at a
# time.
#
# Trust carries two lineages and they are kept apart here. Trees that came from
# rust-lang/rust stay with the Rust Project Developers even where Trust has
# edited files inside them; trees Trust wrote are Andrew Yates's. Both grants
# are the same dual license, so the split changes attribution, never terms.
#
# Annotations are matched last-wins, so each block that narrows an earlier one
# must sit below it. The third-party exceptions and the Trust-owned block below
# both depend on that ordering.
#
# See https://reuse.software and https://github.com/fsfe/reuse-tool for more
# details. We currently use reuse-tool version 4.0.3.

# ---------------------------------------------------------------------------
# Inherited from rust-lang/rust.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    "compiler/**",
    "library/**",
    "tests/**",
    "src/**",
    ".github/**",
    "Cargo.lock",
    "Cargo.toml",
    "CODE_OF_CONDUCT.md",
    "bootstrap.example.toml",
    "configure",
    "COPYRIGHT",
    "INSTALL.md",
    "LICENSE-APACHE",
    "license-metadata.json",
    "LICENSE-MIT",
    "REUSE.toml",
    "rustfmt.toml",
    "x",
    "x.ps1",
    "x.py",
    ".gitignore",
    ".gitmodules",
]
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Developers (see https://thanks.rust-lang.org)"
SPDX-License-Identifier = "MIT OR Apache-2.0"

