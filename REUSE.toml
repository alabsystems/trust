# ---------------------------------------------------------------------------
# Trust's own code. Everything below narrows one of the inherited blocks above
# and therefore has to stay below it.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    "crates/**",
    "targo-trust/**",
    "benchmarks/**",
    "bootstrap/**",
    "docs/**",
    "examples/**",
    "proofs/**",
    "publish/**",
    "release/**",
    "scripts/**",
    "tools/**",
    "trust-conformance/**",
    "src/tools/trustup/**",
    "src/tools/trust-stage0-dist/**",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "NOTICE",
    "README.md",
    "SECURITY.md",
    "SUPPORT.md",
    "VISION.md",
    "patches/README.md",
    ".gitleaks.toml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Andrew Yates"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Patches Trust carries against third-party sources. The diffs are derived from
# the software they patch, so they keep that software's terms rather than
# Trust's; patches/README.md above is Trust's own prose. Today the only patch is
# against LLVM, whose vendored tree is annotated identically further up.
[[annotations]]
path = "patches/*.patch"
precedence = "override"
SPDX-FileCopyrightText = [
    "2003-2019 by the contributors listed in CREDITS.TXT (https://github.com/rust-lang/llvm-project/blob/7738295178045041669876bf32b0543ec8319a5c/llvm/CREDITS.TXT)",
    "2010 Apple Inc",
    "2003-2019 University of Illinois at Urbana-Champaign.",
]
SPDX-License-Identifier = "NCSA AND Apache-2.0 WITH LLVM-exception"

# Trust-authored files that live inside an inherited crate because that is where
# the compiler pass has to be. `trusty` targets are an unrelated upstream OS and
# are deliberately not listed here.
[[annotations]]
path = [
    "compiler/rustc_codegen_trust_cg/**",
    "compiler/rustc_middle/src/mir/trust_contract.rs",
    "compiler/rustc_middle/src/mir/trust_proof.rs",
    "compiler/rustc_middle/src/mir/trust_proof_item.rs",
    "compiler/rustc_mir_build/src/trust_replay.rs",
    "compiler/rustc_mir_transform/src/trust_contract_query.rs",
    "compiler/rustc_mir_transform/src/trust_contract_query/**",
    "compiler/rustc_mir_transform/src/trust_ir_flip.rs",
    "compiler/rustc_mir_transform/src/trust_ir_flip/**",
    "compiler/rustc_mir_transform/src/trust_proof_query.rs",
    "compiler/rustc_mir_transform/src/trust_r1_oracle.rs",
    "compiler/rustc_mir_transform/src/trust_verify.rs",
    "compiler/rustc_mir_transform/src/trust_verify/**",
    "compiler/rustc_session/src/config/tests/trust_output_types.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Andrew Yates"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The Trust mark. Replaces the Rust Foundation's logo assets, whose filenames are
# a static-file protocol that rustdoc's templates and build script depend on, and
# that the WiX installer sources reference by name.
[[annotations]]
path = [
    "src/librustdoc/html/static/images/favicon.svg",
    "src/librustdoc/html/static/images/favicon-32x32.png",
    "src/librustdoc/html/static/images/rust-logo.svg",
    "src/etc/installer/gfx/banner.bmp",
    "src/etc/installer/gfx/dialogbg.bmp",
    "src/etc/installer/gfx/rust-logo.ico",
    "src/etc/installer/gfx/rust-logo.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Andrew Yates"
SPDX-License-Identifier = "MIT OR Apache-2.0"
