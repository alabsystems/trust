# Audited escape sites for the landing gate's selector (scripts/lib/land_select.py).
#
# The escape scan resolves what a package reads outside itself from the source
# (include macros, #[path], build-script literals, `../` literals, harvested
# repository paths). A site it cannot resolve makes the package read EVERYTHING,
# which selects every leg whose closure holds it. Each row below is a site that
# was READ BY A PERSON and resolved; it holds only while the file's blob is the
# one recorded here. Any edit to the file lapses the row (the site is
# unresolved again, fail-closed) until someone re-reads it and updates `blob`.
# A push that moves the file or a premise must, in the same push, renew the row
# (re-read it, record why it still holds, update every pin it moved) or mark it
# `lapsed`: the push row `fast.ledger-pins` (scripts/check_ledger_pins.py,
# LEDGER-PIN-CURRENCY-AT-LANDING-1) refuses a pin that moved with neither.
#
#   file     repo-relative path of the source file
#   blob     `git rev-parse HEAD:<file>` the audit was made against
#   class    "compile" (build script, proc macro, include) or "runtime"
#   reads    repo-relative prefixes the file reads outside its package ([] = none)
#   history  false: no history read; "value-only": it reads HEAD only to stamp a
#            version string, which no verdict depends on (the same argument as
#            CFG_VER_HASH, docs/LANDING_GATE.md); true: its result depends on
#            history, so a cache key over it includes the HEAD commit
#   premises other files the reasoning rests on ({ file, blob }); the row holds
#            only while each is that blob too
#   lists    repo-relative prefixes or globs whose EXISTENCE the file reads (which
#            paths are there), never their content: only a change that keeps a
#            regular file a regular file at the same path does not reach them
#   reason   what was read, where
#   lapsed   only on a row that no longer holds: "YYYY-MM-DD <commit>: <what
#            moved, and why it was not renewed>". The row grants nothing (its
#            site is unresolved, fail-closed) and keeps its last reviewed pins
#            for the next review; the ledger's currency tests skip it by this
#            key, never by a blob that differs. Renewing the row removes it.
#
# [[not_path]] rows name literal values one file spells that were traced and never
# name a path of this checkout (a message label, a fixture's package name). The
# file is scanned like any other; the selector's literal harvest only skips a lone
# literal of a listed value that no path, file-system or process call takes (no
# enclosing call, and nothing else in its statement, names one), while the file
# and every premise are at their blobs. Keys: file, blob, literals (each without
# a quote, backslash or newline), via, premises, reason, lapsed. `via` lists the
# identifiers through which the value can leave the file (a pub(crate) const, an
# accessor); it must be [] (the value stays in a private fn or test module): a
# reader elsewhere may sit where no scan of the package sees, so a non-empty
# `via` exempts nothing. Any other key, or a malformed one, exempts nothing.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache-2.0 OR MIT

