# trust-binary-parse: Binary format parsing for trust reverse compilation
#
# Parses ELF, Mach-O, PE binaries, DWARF debug info, and symbol demangling
# from first principles. Zero external dependencies (except thiserror).
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache 2.0

[package]
name = "trust-binary-parse"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Default features OFF: trust-types' only default is the nightly `try-sugar`
# feature (the `?`-sugar on `Discharge`), and this crate uses none of it — only
# `trust_types::fx` maps and `BinarySegmentPermissions`. With the default on,
# this edge was the ONLY thing enabling `try-sugar` in trust-lift's graph
# (measured 2026-09-27 with `targo tree -p trust-lift -e features -i trust-types`).
trust-types = { path = "../trust-types", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
