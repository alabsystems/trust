[package]
name = "trust-proof-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
trust-types = { workspace = true }
# trust-ir carries the kernel-checkable `ProofEvidence::CleanCic` term the cold
# packaging path embeds (M-Pkg). Leaf data crate, zero required runtime deps.
trust-ir = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
bincode = { workspace = true }
# PHASE 1d: the name `ed25519-dalek` resolves to the Trust-owned `trust-ed25519`
# through Cargo's dependency renaming (see the workspace entry). `use
# ed25519_dalek::{...}` in `signing.rs` compiles verbatim; the crate behind the
# name is ours.
ed25519-dalek = { workspace = true }
# PHASE 1b: OS entropy for `CertSigningKey::generate`. Named directly rather
# than aliased over `rand` — `rand`'s surface is enormous and `trust-rand`
# implements only the one function this crate calls, so an alias would make
# every other `rand::` path resolve to nothing at the CONSUMER instead of here.
trust-rand = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# M-Pkg roundtrip test: mints a real QF_LIA CleanCic and kernel-rechecks the
# carried term offline. Dev-only so the kernel/solver stay out of the runtime
# dep graph of this lightweight cert crate.
trust-certify = { workspace = true }
