#
# trust-sha2-compat — the package NAME `sha2`, so `[patch.crates-io]` can
# redirect a dependency graph this repo does not own the manifests of.
#
# WHY A SECOND CRATE EXISTS, WHEN `crates/trust-sha2` IS ALREADY THE
# IMPLEMENTATION.
#
# There are two ways to substitute a dependency, and this tree needs both
# because it has two kinds of consumer:
#
#   1. DEPENDENCY RENAMING, in `crates/Cargo.toml`:
#          sha2 = { package = "trust-sha2", path = "trust-sha2" }
#      Consumers keep writing `use sha2::{Digest, Sha256};` and compile
#      verbatim. This is Phase 1a, already shipped (ab1c30c09e). It works only
#      where WE own the manifest that declares the dependency.
#
#   2. `[patch.crates-io]`, for consumers whose manifests we do NOT own —
#      the `first-party/*` submodules. `first-party/ay/Cargo.toml:281` says
#      `sha2 = "0.10"` and 13 ay crates inherit it. We cannot edit that line
#      without breaking ay's standalone build (see the header of
#      `docs/` track-B notes / the report accompanying this crate), so the
#      substitution has to happen at the workspace root being built, which
#      cargo applies graph-wide — including into path-dependency siblings,
#      whose own `[patch]` tables are ignored.
#
# `[patch]` MATCHES ON THE PROVIDED PACKAGE'S NAME AND VERSION, AND CANNOT
# RENAME. Measured: `sha2 = { package = "trust-sha2", path = ... }` inside a
# `[patch.crates-io]` table is accepted syntactically and then goes UNUSED —
# cargo emits only a `patch ... was not used in the crate graph` WARNING and
# resolves the incumbent. A warning in a build that otherwise goes green is the
# textbook silent instrument: the swap would read as landed while every digest
# still came from the third-party crate. Hence this crate, whose package name
# is literally `sha2` and whose version satisfies the `^0.10` requirement that
# 32 sibling crates spell.
#
# This is precisely the shape of `crates/trust-memchr` (`name = "memchr"`,
# `version = "2.8.3"`, redirected by `[patch.crates-io]` from the root and
# `crates/` manifests). Read that crate's header first; the reasoning is the
# same and it is the executed precedent.
#
# WHY VERSION 0.10.100.
# It must satisfy `^0.10` (so `0.10.x`, and `x` above every real release —
# 0.10.9 is current — so the patch is preferred and a stale `Cargo.lock` cannot
# quietly keep the incumbent). It must NOT be `0.11.x`: `first-party/clean` and
# the `clean-kernel` in ay's own graph require sha2 `^0.11`, a different major,
# which must keep falling through to crates.io until it is separately replaced.
# Measured: a 0.10 patch serves the 0.10 population and leaves a coexisting
# 0.11 requirement resolving normally, in the same graph, with no error.
#
# THE EMPTY THIRD-PARTY DEPENDENCY LIST IS STILL THE POINT.
# The only dependency is `trust-sha2`, first-party, itself dependency-free.
#
# MANIFEST VALUES ARE SPELLED LITERALLY, NOT INHERITED.
# Same rule as `crates/trust-memchr`, and it binds harder here: this crate is
# consumed as a path patch from workspace roots in OTHER REPOSITORIES
# (`first-party/ay`, `-ny`, `-trust-cg`, `-trust-vc`, `-trust-wp`, `-trust-mc`,
# `-trust-ir`). A `*.workspace = true` here would have to resolve against
# whichever root is being built, which is a documented failure mode of this
# repo. Do not "tidy" these into workspace inheritance.

[package]
name = "sha2"
version = "0.10.100"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
publish = false
description = "Package-name alias exporting Trust-owned SHA-2 (crates/trust-sha2, FIPS PUB 180-4) under the name `sha2`, so [patch.crates-io] can redirect manifests this repo does not own."

[lib]
name = "sha2"
path = "src/lib.rs"

[features]
# `default = ["std"]` and `std` are forwarded to trust-sha2, where `std` buys
# exactly one thing: `impl std::io::Write for Sha*`, adding no dependency.
#
# ================= READ THIS BEFORE REMOVING A FEATURE =================
# A FEATURE THIS CRATE DOES NOT DECLARE DOES NOT FAIL THE BUILD. IT SILENTLY
# UN-SUBSTITUTES THAT CONSUMER.
#
# This table first omitted `asm`, on the stated reasoning that a consumer
# enabling an undeclared feature would get a loud cargo error and therefore
# fail closed. THAT REASONING WAS WRONG, and it was wrong in the dangerous
# direction. Measured 2026-08-22 in this repo's real graph:
#
#   `first-party/trust-cg/crates/trust-cg-verify/Cargo.toml:55` says
#       sha2 = { version = "0.10", features = ["asm"] }
#
#   With `asm` undeclared here, cargo did NOT error and did NOT warn. It
#   resolved that one crate back to the incumbent `sha2 0.10.9` from
#   crates.io — while its sibling `trust-cg-codegen`, which spells plain
#   `sha2 = "0.10"`, took the patch. The build was fully green with the
#   incumbent still linked into part of the graph, and BOTH `sha2 0.10.9`
#   and `sha2 0.10.100` sat in `Cargo.lock` at once.
#
#   The only trace was one line in the resolver's report —
#       Adding sha2 v0.10.9 (available: v0.10.100)
#   — formatted identically to the five benign "a newer major exists" notices
#   printed beside it for bincode, rand, syn, toml and num-bigint.
#
# So the feature table is not cosmetic and it is not a place to be minimal:
# it is part of the substitution's completeness. Declaring `asm` flipped
# trust-cg-verify and removed `sha2 0.10.9` from the graph entirely.
#
# THE RULE: this table must cover every feature any consumer in the graph
# enables. When adding a consumer repo, grep its manifests for
# `features = [...]` on sha2 first, and verify afterwards with
#     targo tree -i sha2@0.10.9      # must report: did not match any packages
# Do not verify by reading a green build.
#
# `asm` selects the ARMv8/x86 SHA-2 instruction path upstream. Here it is a
# genuine no-op: same digests, pure performance. That is a safe no-op because
# it cannot change a value. The incumbent's `oid` and `compress` are NOT safe
# no-ops — they add a trait impl and a public function — so they are left
# undeclared: a consumer needing one must be looked at, not stubbed. Measured
# across the 7 in-scope sibling repos, `asm` is the only one anyone enables.
default = ["std"]
std = ["trust-sha2/std"]
asm = []

[dependencies]
# The implementation. First-party, zero third-party dependencies of its own.
# Path is relative to THIS directory, so it resolves identically no matter
# which workspace root pulled the patch in.
trust-sha2 = { path = "../trust-sha2", default-features = false }
