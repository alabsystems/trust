# trust-version: Version identity model for Trust CLI output
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: MIT OR Apache-2.0

[package]
name = "trust-version"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# trust: inherited so this crate resolves `toml` -> `trust-toml` identically in
# BOTH workspaces it is a member of (`crates/` and the repo root). An inline
# spelling here is the one consumer no workspace table can reach — the
# "four of five, measures as zero" case.
toml = { workspace = true }
