# trust-endian: total, verified byte-order (endian) assembly.
#
# Fourth `crates/`-resident component written to PASS the authenticated strict
# lane rather than to be retrofitted onto it, on the same discipline as
# `trust-ratio`, `trust-hex` and `trust-utf`: no dependencies, `#![no_std]`, no
# `derive`, no `impl Display`, no allocation, no loops, no slices.
#
