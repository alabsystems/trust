[package]
name = "trust-vcgen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The former `pipeline-v2` switch was retired after v2 became the only maintained
# implementation. Keeping an off-state advertised a legacy v1 build that no
# longer existed and let `--no-default-features` select an incoherent cfg mix.
# Optional features below add formats or audits; none select VC semantics.
default = []
# Experimental, injectable legacy taint prototype. This does not wire the
# analysis into `generate_vcs` or the compiler's verification verdict. A
# production implementation requires a TrustIR CFG fixpoint and exact callee
# identities; see `src/infoflow.rs`.
prototype-infoflow = []
# Forward binary parser/lifter support for reusable relift APIs.
elf = ["trust-lift/elf"]
macho = ["trust-lift/macho"]
# Test-only differential: build the RETIRED dense-map statement-version oracle
# (two whole-CFG reaching-version fixpoints) beside the SSA oracle that replaced
# it, and assert every version-token answer is byte-identical. Unit tests always
# run it; enable this to run it under the integration tests too
# (`targo --unverified test -p trust-vcgen --features version-oracle-differential`).
# Never enabled by anything that ships.
version-oracle-differential = []
[dependencies]
# Canonical integer bounds used by both VC construction and the kernel-facing
# overflow model. This was a test-only cross-check of duplicated definitions.
trust-semantics = { workspace = true }
trust-floatbits = { workspace = true }
# trust-types is consumed as a pure data layer here (VerifiableFunction,
# VerificationCondition, Formula, ...). We deliberately do NOT pull its
# default `try-sugar` feature (which enables the nightly `try_trait_v2`
# `?`-sugar on `Discharge`): trust-vcgen never uses `?` on `Discharge`, so
# forcing nightly transitively just to depend on the structs is wrong.
# Declared as a direct path dep with default-features = false (instead of
# `{ workspace = true }`, which re-enables try-sugar) so trust-vcgen builds
# on the stable release channel. Trust's own build that needs the sugar
# enables it on the crate that actually uses `?` (trust-types itself / any
# real consumer via `features = ["try-sugar"]`).
trust-types = { path = "../trust-types", default-features = false }
# Trust: `trust-widthconv` is a strict-lane VERIFIED crate (`Gate: PASS`,
# `docs/STRICT_VERIFICATION_FRAGMENT.md` §17). It owns the Rust machine-integer
# width set and the value-preserving conversion rule table that `machine_domain`
# used to decide inline — the table whose row 7 the module header calls "this
# tree's canonical false-proof bug".
#
# COST OF THE EDGE (§16.8): a crate carrying the native `ensures` grammar is not
# compilable by stock rustc, so this dependency makes trust-vcgen
# Trust-toolchain-only, which contradicts the stable-channel intent recorded on
# the `trust-types` line above. That intent was measured UNEXERCISED on
# 2026-08-30 before the edge was taken: no gate in
# `tests/run_trust_comprehensive_harness.sh` builds trust-vcgen on stable, and
# no manifest under `first-party/clean` references it. If `clean` ever does
# consume this crate on stable, THIS dependency is the thing to make optional.
trust-widthconv = { workspace = true }
# trust #513: Binary verification bridge — lift adapter converts LiftedFunction to VCs.
trust-lift = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# An ay `Proved` that the clean kernel does not certify is reported `Unknown`
# under `-Ztrust-policy=certify`, so "the solver said UNSAT" is not the property
# a refute-lane test should assert. `nested_merge_cursor_clamp_realmir.rs` asserts
# the CERTIFIED one — measured to be the direction that separates a discharged
# fixture from an undischarged one. Dev-only: nothing the compiler links.
trust-certify = { workspace = true }
trust-router = { workspace = true, features = ["ay-backend"] }
trust-report = { workspace = true }
# trust #475: Property-based testing for Formula simplification correctness.
proptest = { workspace = true }
