[workspace]

[package]
name = "trust-committed-source"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "Passive bounded committed Git DATA for retained original-source consumers"

[dependencies]
gix = { version = "=0.85.0", default-features = false, features = ["sha1"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
trust-resource-provenance = { path = "../trust-resource-provenance" }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[dev-dependencies]
tempfile = "3"
