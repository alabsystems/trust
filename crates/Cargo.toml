    "trust-js-trace",
    "trust-js-sem",
    "trust-js-differential",
    # TrustJS M1 (docs/design/2026-07-21-trustjs-m1-scope.md): the faithful
    # tier — parser, value model, tier-0 interpreter (fourth harness head).
    "trust-js-parse",
    "trust-js-value",
    "trust-js-interp",
    "trust-js-regexp",
    # TrustJS M2 (docs/design/2026-07-22-trustjs-m2-scope.md D1): the deterministic
    # event loop — microtask/timer queues, virtual clock, reusable Promise core.
    "trust-js-reactor",
    # TrustJS M2 (docs/design/2026-07-22-trustjs-m2-scope.md D2): the module graph —
    # ParseModule records, the three-phase link, evaluate state machine, top-level await.
    "trust-js-modules",
    # TrustTS (front-end increment 1): the fail-closed TS->JS type eraser that
    # lets the faithful interpreter run erasable TypeScript. Untrusted,
    # zero-authority; erase-or-refuse, never a wrong strip.
    "trust-ts-strip",
    # TrustJS M3 D2 (docs/design/2026-07-22-trustjs-m3-scope.md): the first
    # kernel-certified JS builtin — String.prototype.toLowerCase over ASCII,
    # bridged through the trust-certify finite-table lane to a CleanCic receipt.
    "trust-js-certify-bridge",
    # TrustJS M4 strict-mode arithmetic FLOOR (docs/design-notes/2026-07-23-m4-strict-arith-floor.md):
    # the DETERMINISTIC, correct-by-construction lowering of ONE tiny pure-arith
    # JS fragment, fidelity-checked bit-for-bit against the trust-js-interp
    # oracle. NOT the M4 autoformalization tier (no LLM / intent / native install).
    "trust-js-autoform",
]
# trust-mir-extract requires rustc_private (nightly).
exclude = [
    "trust-mir-extract",
    "trust-thir-lower",
