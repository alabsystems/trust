[workspace]
resolver = "2"

members = [
    "trust-binary-parse",
    "trust-cache",
    "trust-buildcache",
    "trust-deps",
    "trust-disasm",
    "trust-loop",
    "trust-types",
    "trust-symbols",
    "trust-upstream-compat",
    "trust-verifier-api",
    "trust-version",
    "trust-vcgen",
    "trust-os",
    "trust-router",
    "trust-report",
    "trust-ts-embed",
    "trust-release",
    "trust-convergence",
    "trust-temporal",
    "trust-proof-cert",
    # Total, VERIFIED ratio and clamp arithmetic for Trust's own scorecards.
    # The first crates/-resident component written to PASS the authenticated
    # strict lane rather than to be retrofitted onto it: no dependencies, no
    # `derive`, no `impl Display`, no allocation, and a grammar `ensures`
    # clause on every public function. It exists because the repo's own
    # percentage arithmetic is open-coded ~30 times with `.max(1)` denominators
    # that silently substitute a population nobody chose.
    "trust-ratio",
    # Sibling of `trust-ratio` on the same discipline: total, `no_std`,
    # zero-dependency ASCII hex codec primitives, written to PASS the
    # authenticated strict lane rather than to be retrofitted onto it. It exists
    # because the nibble arithmetic under every `format!("{b:02x}")` in this tree
    # is open-coded with two unproved side conditions — that `byte >> 4` is a
    # valid index into a 16-entry table, and that `b - b'a' + 10` cannot
    # underflow. Both are machine-checked here.
    "trust-hex",
    # Third component on the `trust-ratio`/`trust-hex` discipline: total,
    # `no_std`, zero-dependency UTF-8 and UTF-16 scalar arithmetic, written to
    # PASS the authenticated strict lane. It exists because the surrogate and
    # continuation-byte arithmetic on this tree's untrusted-input paths carries
    # side conditions nobody discharges — `trust-json`'s `\uXXXX` reader
    # subtracts `0xD800` from a code unit that only a range pattern constrains,
    # and the two JS `String.fromCodePoint`/`decodeURIComponent` reassemblers
    # each hide the same arithmetic behind `u16::try_from(..).expect(..)`.
    "trust-utf",
    "trust-clean",
    # I4 (docs/design/2026-08-04-two-language-compiler-architecture.md): Clean
    # type -> Rust carrier. The ONLY sound producer of `CarrierEvidence::Total`,
    # and therefore the gate that stands between a Clean `Nat` and a wrapping
    # `u64` in the emitted binary. Lands before any `DefId` is minted.
    "trust-clean-carrier",
    # Phase 1 of the third-party replacement program: the Trust-owned crypto
    # primitives that retire `sha2`/`hmac` (and, with them, `digest`,
    # `crypto-common`, `block-buffer`, `generic-array`, `typenum`, `subtle`)
    # from the verified lane's `dependency-policy-excluded` list. Zero
    # third-party dependencies by construction; trust-hmac depends only on
    # trust-sha2, because HMAC is defined over a hash. NOT yet redirected into
    # the consumers — the `[patch.crates-io]` swap lands only after the
    # differential against the incumbents is green.
    "trust-sha2",
    "trust-hmac",
    # Phase 1b of the same program: the Trust-owned OS-entropy facade that
    # retires `rand` (and with it `rand_chacha`, `rand_core`, `getrandom`,
    # `wasi`) from `crates/`, and `getrandom` from `targo-trust`. Zero
    # third-party dependencies; two fail-closed arms (getentropy(2), then
    # /dev/urandom) and no path that returns bytes it did not get from the OS.
    # Unlike sha2/hmac this is NOT a `package = ` rename — see the note at the
    # `sha2`/`hmac` entries below and the crate's own Cargo.toml header.
    "trust-rand",
    # Phase 1d of the same program, and the largest piece: the Trust-owned
    # Ed25519 (RFC 8032 §5.1) with the curve25519 field and group arithmetic it
    # needs. It retires `ed25519-dalek` and the 34-package closure behind it —
    # the `curve25519` family, `fiat-crypto`, `der`/`pkcs8`/`spki`/`const-oid`,
    # `subtle`, `zeroize`, and crucially crates.io `sha2` itself, which phase 1a
    # could not remove from `crates/` because this edge still pulled it.
    # Depends only on `trust-sha2` (RFC 8032 Ed25519 IS SHA-512 by definition).
    # RENAMED OVER `ed25519-dalek` below — the integration landed, gated on
    # `trust-ed25519/tests/differential_ed25519.rs` (17/17, 5655 cases, 0
    # disagreements) and `trust-rand/tests/ed25519_equivalence.rs` (the keygen
    # call-site rewrite). The incumbent survives ONLY as those two crates'
    # explicit-version dev-dependency, which is what keeps the gates real.
    "trust-ed25519",
    # Phase 2 of the same program, and the first non-crypto replacement: the
    # Trust-owned TOML v1.0.0 reader. Measured on this workspace's shipping
    # closure (NORMAL dep-kind edges, platform-filtered), converting the five
    # `crates/` consumers of `toml` takes the third-party unit count 121 -> 115
    # by retiring `toml`, `toml_edit`, `toml_datetime`, `toml_write`,
    # `serde_spanned` and `winnow`. Unlike the `serde` stack, every in-closure
    # parent of `toml` is a member of THIS workspace, so nothing is deferred
    # across a `first-party/*` sibling.
    #
    # RENAMED over `toml` below and WIRED into every consumer. Both halves
    # exist: the read path (`from_str`, `Value`, `Table`, `de::Error`) and the
    # write path (`to_string` / `to_string_pretty` — 11 call sites across
    # trust-js-differential). Both preconditions the earlier text set are met —
    # the differential against the incumbent is green and the serialize path
    # exists.
    #
    # The rename landed in ONE commit across all seven consumers plus BOTH
    # workspace tables, because a partial rename would not fail loudly: it would
    # compile in four consumers and leave the fifth on the registry crate, which
    # measures as a kill of ZERO. `trust-version` needed its own edit — its
    # manifest spelled `toml` inline, so neither workspace table reached it.
    "trust-toml",
    # Phase 2 of the same program, binary half: the Trust-owned `bincode 1.x`
    # wire format. Unlike `toml` (a feature-flag question) `bincode 1.3.3` is
    # an UNCONDITIONAL serde blocker — its manifest declares
    # `[dependencies.serde] version = "1.0.63"` with no `optional` and no
    # feature gate, so no flag can remove the edge and the package has to be
    # replaced. Consumers: trust-certify (23 sites), trust-clean (9),
    # trust-proof-cert (2), trust-types (10, dev-only), plus 11 in
    # `first-party/trust-ir`'s `clean_expr_codec`.
    #
    # LANDS INERT, deliberately: it is a member so it is built and tested, and
    # NOTHING depends on it. The swap is a separate step, and it must not be a
    # graph-wide `[patch.crates-io] bincode` while the acceptance differential
    # still needs the incumbent's own bytes — see the `sha2` block above for
    # the measured instance of exactly that mistake (a differential comparing
    # a crate to ITSELF, green, testing nothing).
    #
    # `bincode 2.0.1` is a different problem (its serde IS optional) and is
    # out of this crate's scope.
    "trust-bincode",
    # The package-name alias `sha2` (see its manifest). `[patch.crates-io]`
    # substitutes by package NAME and cannot rename, so the dependency-rename
    # above reaches only manifests WE own; the `first-party/*` submodules,
    # whose manifests we cannot edit without breaking their standalone builds,
    # are reached by patching this crate in instead. Same shape as
    # `trust-memchr`. Being a member only means it is built and tested here —
    # it is NOT yet patched into anything; see its manifest for the two
    # measured preconditions.
    "trust-sha2-compat",
    # Phase 2 of the third-party replacement program, JSON half: the
    # Trust-owned `serde_json` data model, writer and parser. Zero
    # dependencies. Its gate is a BYTE differential, not a semantic one --
    # `crates/trust-types/src/digest.rs` hashes serialized JSON, so
    # equally-valid-but-differently-spelled output silently rewrites every
    # digest in the tree. NOT yet renamed over `serde_json`: the rename is
    # blocked on the serde-traits layer, which is a six-repository change.
    "trust-json",
    # I6, runtime half: the Trust-owned arbitrary-precision natural with Lean
    # Nat semantics EXACTLY (truncated sub, n/0 = 0, n%0 = n) — the bignum
    # carrier §5b names as the default for unbounded Clean types. Zero
    # dependencies, no_std; deliberately independent of clean-kernel's BigNat
    # so the agreement tests are evidence, not a shared bug.
    "trust-bignum",
    # I5: the Clean-origin CALL lane — the gated DefId-mint decision and the
    # carrier-typed faithfulness gate. Not yet wired into the compiler; see the
    # crate docs for the four measured blockers.
    "trust-clean-origin",
    # The Clean -> TrustIR producer: the SECOND consumer of a sealed
    # `CleanOriginPlan`, so the two authoritative languages meet in TrustIR
    # rather than in MIR.
    "trust-clean-ir",
    "trust-certify",
    "trust-semantics",
    "trust-decompile",
    "trust-strengthen",
    "trust-spec",
    "trust-backprop",
    "trust-symex",
    "trust-transval",
    "trust-integration-tests",
    "trust-lift",
    "trust-machine-sem",
    # first-party memchr; package name is `memchr` (see its manifest)
    "trust-memchr",
    "trust-bmc",
    "trust-wp",
    "trust-vc-bridge",
    "trust-wasm-bridge",
    "trust-cg-bridge",
    "trust-ir-bridge",
    "trust-ny-bridge",
    # R4 landing (two-language spec surface §5): the L2 elaborator + honesty
    # meter, migrated from trust-wp into trust proper.
    "trust-cert-meter",
    "trust-spec-elab",
    # TrustJS M0 (docs/design/2026-07-20-trustjs-m0-scope.md): the measurement
    # apparatus — trace projection, independent-semantics skeleton, and the
    # Channel-A differential harness.
    "trust-js-trace",
    "trust-js-sem",
    "trust-js-differential",
    # TrustJS M1 (docs/design/2026-07-21-trustjs-m1-scope.md): the faithful
    # tier — parser, value model, tier-0 interpreter (fourth harness head).
    "trust-js-parse",
    "trust-js-value",
    "trust-js-interp",
    "trust-js-regexp",
    # TrustJS M2 (docs/design/2026-07-22-trustjs-m2-scope.md D1): the deterministic
    # event loop — microtask/timer queues, virtual clock, reusable Promise core.
    "trust-js-reactor",
    # TrustJS M2 (docs/design/2026-07-22-trustjs-m2-scope.md D2): the module graph —
    # ParseModule records, the three-phase link, evaluate state machine, top-level await.
    "trust-js-modules",
    # TrustTS (front-end increment 1): the fail-closed TS->JS type eraser that
    # lets the faithful interpreter run erasable TypeScript. Untrusted,
    # zero-authority; erase-or-refuse, never a wrong strip.
    "trust-ts-strip",
    # TrustJS M3 D2 (docs/design/2026-07-22-trustjs-m3-scope.md): the first
    # kernel-certified JS builtin — String.prototype.toLowerCase over ASCII,
    # bridged through the trust-certify finite-table lane to a CleanCic receipt.
    "trust-js-certify-bridge",
    # TrustJS M4 strict-mode arithmetic FLOOR (docs/design-notes/2026-07-23-m4-strict-arith-floor.md):
    # the DETERMINISTIC, correct-by-construction lowering of ONE tiny pure-arith
    # JS fragment, fidelity-checked bit-for-bit against the trust-js-interp
    # oracle. NOT the M4 autoformalization tier (no LLM / intent / native install).
    "trust-js-autoform",
]
# trust-mir-extract requires rustc_private (nightly).
exclude = [
    "trust-mir-extract",
    "trust-thir-lower",
    "trust-witness",
]

# The lint policy Trust-owned members inherit with `[lints] workspace = true`.
# It exists so tightening the policy reaches every member from one place; the
# opt-in itself is enforced by tidy's `workspace_lints` ratchet. Keep it in
# step with the root workspace's table.
[workspace.lints.rust]
warnings = "warn"
# Trust: `env_mutation` is Allow-by-default in the compiler so that upstream
# code compiles identically (it broke 8 upstream UI tests at `Warn`, whose
# stderr is compared). The stance is kept exactly where Trust owns the code:
# every member inheriting this table gets the full diagnostic signal.
env_mutation = "warn"
# ... and stock rustc does not know that lint name. The `crates/` fast lane
# (`cargo check` under the host toolchain) would otherwise emit
# `warning[E0602]: unknown lint` for every unit, which `warnings = "warn"`
# above turns into noise and a `-D warnings` lane would turn into an error.
# Allowing the META-lint keeps the real one live under trustc and silent
# under a compiler that has never heard of it.
unknown_lints = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]

[workspace.dependencies]
trust-binary-parse = { path = "trust-binary-parse" }
trust-cache = { path = "trust-cache" }
trust-buildcache = { path = "trust-buildcache" }
trust-deps = { path = "trust-deps" }
trust-disasm = { path = "trust-disasm" }
trust-loop = { path = "trust-loop" }
trust-types = { path = "trust-types" }
trust-verifier-api = { path = "trust-verifier-api" }
trust-version = { path = "trust-version" }
trust-vcgen = { path = "trust-vcgen" }
trust-os = { path = "trust-os" }
trust-router = { path = "trust-router" }
trust-report = { path = "trust-report" }
trust-ts-embed = { path = "trust-ts-embed" }
trust-release = { path = "trust-release" }
trust-clean = { path = "trust-clean" }
trust-clean-origin = { path = "trust-clean-origin" }
trust-clean-ir = { path = "trust-clean-ir" }
trust-bignum = { path = "trust-bignum" }
# Phase 1 crypto replacement. trust-hmac consumes trust-sha2's `Digest`; no
# consumer crate points at either yet.
trust-sha2 = { path = "trust-sha2" }
trust-hmac = { path = "trust-hmac" }
# Phase 1d: Trust-owned Ed25519. Depends only on trust-sha2. Reached by
# consumers under the RENAMED name `ed25519-dalek` below; this entry exists so
# the two workspace tables stay aligned and so a future consumer can name the
# crate directly.
trust-ed25519 = { path = "trust-ed25519" }
# Phase 2: the Trust-owned TOML reader AND writer. It IS aliased over `toml`
# below — this entry is retained so the two workspace tables stay aligned and so
# a consumer can name the crate directly, exactly as `trust-sha2`/`trust-hmac`/
# `trust-ed25519` above do alongside their own aliases.
trust-toml = { path = "trust-toml" }
# Phase 2, JSON half: the Trust-owned `serde_json`. Named `trust-json`, NOT
# aliased over `serde_json`. The alias is what makes 1350 `#[derive(Serialize)]`
# sites resolve here, and those need the serde TRAITS, which this crate
