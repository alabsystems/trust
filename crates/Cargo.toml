# trust verification pipeline workspace
#
# This is the dev/test lane for the Trust crates. It exists so `cargo
# check`/`cargo test` over the pipeline is a single command that does not have
# to load — or build — the rustc graph; the root workspace cannot offer that,
# because rustc-main is a member there and `--workspace` therefore means "the
# whole compiler".
#
# Most members here are ALSO members of the root workspace, because the
# compiler links them. They are consequently resolved twice, against two
# lockfiles that today disagree on the patch version of ~89 third-party
# packages. Treat a green run here as evidence about *this* graph; proof-
# bearing claims belong to the compiler lane, whose graph is the root lockfile.
#
# The split is not caused by a dependency conflict. Folding every member into
# the root workspace resolves with no version disagreement (it adds only
# ny-cert and ny-contracts). What holds the split in place is that this
# manifest path is named by 39 files — gate rows, harness lanes, fixture
# regenerators, targo-trust source — so collapsing the workspaces means moving
# all of them in the same change.
#
# `scripts/check_cargo_manifest_alignment.py` keeps this manifest's [patch]
# tables identical to the root's and reports membership drift. It is not only a
# drift checker: it also enforces the default dependency-fanout policy
# (`--fanout-tree-proof`) that keeps the native solver backends out of the
# default trust-bmc/trust-router trees. That policy outlives any workspace
# consolidation.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: MIT OR Apache-2.0

# P3 dev-build profile tuning.
#
# Measured impact on this workspace (clean cold build, default toolchain):
#   default profile:     ~61s
#   with these tweaks:   ~47s (-23%)
#
# `debug = "line-tables-only"` keeps the line-number info needed for
# panics and backtraces but drops local-variable and type debug info.
# Substantially reduces debug-info codegen and link time without
# affecting stack traces. Use `debug = 2` (the default) only when
# stepping through with a debugger.
#
# `incremental = true` is the cargo default for dev, stated explicitly
# so it is not silently disabled by CI inheriting `CARGO_INCREMENTAL=0`.
#
# `split-debuginfo = "unpacked"` is the cargo default on macOS/Linux
# for dev profile; stated explicitly so it survives target changes.
[profile.dev]
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

# Dependencies don't need debug info at all for our workflow — we never
# step into serde / proc-macro2 / etc. Dropping their debug info
# significantly reduces link time on cold builds.
[profile.dev.package."*"]
debug = false

# The Lean↔Clean bridge gate (trust-clean's DEFAULT-ON tests/lean_clean_bridge.rs)
# kernel-checks ~40 theorems against a machine-imported 14.7K-constant olean
# environment; at opt-level 0 the clean kernel/elaborator make that run (and the
# other clean-kernel-heavy suites) an order of magnitude slower. Optimize just
# the clean crates in dev/test dependency builds — a pure speed knob, no
# semantic change (cargo builds test-target DEPENDENCIES with the dev profile).
[profile.dev.package.clean-kernel]
opt-level = 2
[profile.dev.package.clean-olean]
opt-level = 2
[profile.dev.package.clean-parser]
opt-level = 2
[profile.dev.package.clean-elab]
opt-level = 2

# Keep `cargo test` compilation aligned with dev-build iteration: tests still
# get line-number backtraces, but avoid generating full debug info for every
# crate and dependency.
[profile.test]
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.test.package."*"]
debug = false

