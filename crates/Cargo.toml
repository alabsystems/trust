# PHASE 1 SUPPLY-CHAIN REPLACEMENT — these two names now resolve to Trust-owned
# crates, via Cargo's dependency RENAMING (`package = `). Every member that
# writes `sha2 = { workspace = true }` and `use sha2::{Digest, Sha256}` keeps
# compiling verbatim; the crate behind the name is ours. That is deliberate:
# the alternative (rewriting `use sha2::` to `use trust_sha2::` in 20 crates and
# ~79 files) is a large diff whose every line is a chance to miss a call site,
# for identical behaviour.
#
# The swap is gated on `crates/trust-sha2/tests/differential_sha2.rs` and
# `crates/trust-hmac/tests/differential_hmac.rs`, which compare against the
# INCUMBENTS — those two crates therefore name `sha2`/`hmac` by explicit version
# in their own dev-dependencies rather than through the workspace, because here
# the workspace name no longer means the incumbent.
sha2 = { package = "trust-sha2", path = "trust-sha2" }
hmac = { package = "trust-hmac", path = "trust-hmac" }
# PHASE 1d, SAME RENAME MECHANISM. `use ed25519_dalek::{...}` compiles verbatim
# against the Trust-owned crate; the crate behind the name is ours. This retires
# the 34-package incumbent closure — `curve25519-dalek(+derive)`, `fiat-crypto`,
# `ed25519`, `signature`, `subtle`, `zeroize`, `rand_core` — and, with it, the
# last `crates/` edge into crates.io `sha2`.
#
# THE FEATURE LIST IS GONE, AND ITS ABSENCE IS LOAD-BEARING. `trust-ed25519`
# declares no `[features]` at all, and Cargo hard-errors on a feature a renamed
# dependency does not have ("... depends on X with feature `rand_core` but X
# does not have that feature"). `rand_core` existed only to reach
# `SigningKey::generate`, whose bound is the third-party `rand_core::
# CryptoRngCore` trait; `trust-ed25519` deliberately omits that constructor and
# `trust-proof-cert` now seeds `from_bytes` with `trust_rand::secret_seed_32()`.
#
# The gate stays REAL because `trust-ed25519` and `trust-rand` name the
# incumbent by explicit version in their own dev-dependencies rather than
# through this table — so the differential and the keygen-equivalence test
# still compare against crates.io `ed25519-dalek 2.x`, not against ourselves.
ed25519-dalek = { package = "trust-ed25519", path = "trust-ed25519" }
# `rand` IS GONE — deliberately NOT replaced by a `rand = { package =
# "trust-rand", ... }` alias. sha2/hmac/ed25519-dalek are drop-ins, so renaming
# their names is a zero-source-edit swap; `rand`'s surface is enormous and
# `trust-rand` implements the one function this tree called, so an alias would
# make every other `rand::` path resolve to nothing and report the error at the
# CONSUMER instead of here. Consumers name `trust-rand` directly — there is
# exactly one, `trust-proof-cert`.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# trust: PHASE 1e, same rename mechanism as `sha2`/`hmac`/`ed25519-dalek`
# above. Retires the incumbent's cluster — `toml`, `toml_edit`,
# `toml_datetime`, `toml_write`, `serde_spanned`, `winnow` — from the shipping
# closure. All five NORMAL consumers (trust-clean, trust-deps,
# trust-js-differential, trust-upstream-compat, trust-version) plus the two dev
# consumers (trust-bmc, trust-router) flip together: a PARTIAL rename measures a
# kill of ZERO, because one surviving edge keeps `toml` in the closure.
#
# The acceptance gate stays REAL: `crates/trust-toml` dev-depends on the
# incumbent by EXPLICIT VERSION (`incumbent-toml = { package = "toml", version
# = "0.8.23" }`), not through this table, so `tests/differential_corpus.rs` and
# `tests/serialize_differential.rs` keep comparing against crates.io rather than
# against themselves. That dev-dep is also why `toml 0.8.23` REMAINS in
# `crates/Cargo.lock` after a complete swap — `Cargo.lock` carries no dep-kind
# field, so only a normal-kind, platform-filtered `targo metadata` query shows
# the real shipping closure.
toml = { package = "trust-toml", path = "trust-toml" }
