indexmap = "2.7"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"
num-bigint = "0.4"
proptest = "1.11"
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }
