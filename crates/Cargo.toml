# trust-ny-bridge (NS-Stage 0): the LEAF ny-cert certificate crate. Light deps
# (serde / serde_json / thiserror / num-*); routed through trust-certify so a
# neural-shaped Farkas obligation hits the same clean-kernel-checked path.
