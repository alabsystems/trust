# clean-kernel: workspace dep for trust-clean (renamed from trust-clean).
clean-kernel = { path = "../first-party/clean/crates/clean-kernel", features = ["math-overlays"] }
# clean-auto: in-process ay backend + kernel proof reconstruction, consumed by
# trust-certify for the Certified tier (de Bruijn criterion). Public API only.
clean-auto = { path = "../first-party/clean/crates/clean-auto" }
# clean-verify: kernel self-verification spec. Consumed by trust-certify's
# checker-core lane to obtain the DerivedProved KExpr de Bruijn lemma
# (`lift_instantiate_swap`) proof term + goal, kernel-rechecked in-process.
# Public API only (`Specification`, `SpecDefinition`).
clean-verify = { path = "../first-party/clean/crates/clean-verify" }
# clean-parser / clean-elab: used by the checker-core lane ONLY to elaborate the
# negative-control fake term in the spec environment (parse -> ElabCtx ->
# instantiate), so the kernel recheck rejects a well-formed wrong-typed term.
# Already in the dependency graph via clean-verify.
clean-parser = { path = "../first-party/clean/crates/clean-parser" }
clean-elab = { path = "../first-party/clean/crates/clean-elab" }
# clean-olean: machine-import of trust-ir's real Lean 4.8 .olean semantics into a
# clean-kernel Environment. Consumed by trust-clean's Lean↔Clean bridge gate
# (`trustir_bridge`), which loads the VENDORED artifacts under
# crates/trust-clean/fixtures/trustir-oleans + vendor/lean-core-oleans and proves
# the per-op semIntBinOp agreement theorems against the imported constants.
clean-olean = { path = "../first-party/clean/crates/clean-olean" }
rayon = "1.10"
# tracing: used by trust-router's in-process ay backend to suppress ay's
# solver-internal diagnostics during a solve (thread-local no-op subscriber;
# TRUST_AY_LOG opts back in). Must unify with the tracing-core version ay-dpll
# dispatches through (single tracing-core 0.1.x in the lockfile).
tracing = "0.1"
# trust: ay resolves from the repo-owned snapshot; do not restore Git sources here.
ay = { path = "../first-party/ay/crates/ay" }
# trust (proof-carrying ay, milestone 1): ay-core supplies the structured
# `Proof`/`TermStore`/`FarkasAnnotation` data that clean-auto reconstructs into a
# kernel term. Consumed by trust-router's `ay-certify` feature.
ay-core = { path = "../first-party/ay/crates/ay-core" }
# trust: ay-bindings typed builder API for direct ay integration
ay-bindings = { path = "../first-party/ay/crates/ay-bindings" }
# trust (sealed-authority S3): ay-chc typed CHC/PDR solver — consumed by
# trust-bmc's replay_oracle behind the trust-mc-native-solver feature so the
# gate can re-run validate_external_invariant_model in-process. The [patch]
# entries below unify this path source with trust-mc's git-pinned ay-chc.
ay-chc = { path = "../first-party/ay/crates/ay-chc" }
# trust #879: ay-proof-common shared types for proof checker crates
ay-proof-common = { path = "../first-party/ay/crates/ay-proof-common" }
# trust: ay-proof zero-trust bit-blast proof exporter (BvExpr + export_bv_blast_proof_expr)
# consumed by the trust-cg M-POS gate to produce kernel-re-checkable bit-blast certs.
ay-proof = { path = "../first-party/ay/crates/ay-proof" }
# trust: trust-mc bounded model checker
trust-mc-verifier = { path = "../first-party/trust-mc", package = "trust-mc" }
# trust: trust-mc-core VC IR for direct BMC/CHC integration
trust-mc-core = { path = "../first-party/trust-mc/trust-mc-core" }
trust-mc-trust-bmc = { path = "../first-party/trust-mc/trust-mc-trust-bmc" }
# trust: trust-wp deductive verification
trust-wp-core = { path = "../first-party/trust-wp/crates/trust-wp-core" }
trust-wp-ay = { path = "../first-party/trust-wp/crates/trust-wp-ay" }
# trust: trust-vc ownership-aware verification
trust-vc-core = { path = "../first-party/trust-vc/crates/trust-vc-core" }
trust-vc-trust-engine = { path = "../first-party/trust-vc/crates/trust-vc-trust-engine" }
# trust #815: trust-cg verified codegen backend
