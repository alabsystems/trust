# trust-align: total, verified alignment / padding / layout-offset arithmetic.
#
# Ninth `crates/`-resident component written to PASS the authenticated strict
# lane rather than to be retrofitted onto it, on the same discipline as
# `trust-ratio`, `trust-hex`, `trust-utf`, `trust-endian`, `trust-index`,
# `trust-varint`, `trust-checksum` and `trust-radix64`: no dependencies,
# `#![no_std]`, no `derive`, no `impl Display`, no allocation, no loops, no
# mutable slices.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
