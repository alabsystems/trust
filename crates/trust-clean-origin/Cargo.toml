#
# trust-clean-origin — increment I5 of
# docs/design/2026-08-04-two-language-compiler-architecture.md.
#
# THE TWO DECISION POINTS OF THE CLEAN-ORIGIN CALL LANE.
#
# Every other direction in Trust is refutation-shaped: it can only decline to
# prove something, so a disagreement costs a failed build. This is the ONE
# direction that can PRODUCE A VALUE, so a disagreement is a WRONG BINARY.
# The two decisions live here, and both fail closed:
#
#   1. `mint`  — may a `DefId` be minted for a Clean island declaration at all?
#                Requires `KernelChecked` AND an audited-empty axiom closure AND
#                a total carrier. Any missing precondition => no `DefId`.
#   2. `gate`  — does the lowered body agree with the Clean `def`? Decided by
#                kernel definitional equality or a kernel-checked, axiom-free
#                structural-induction proof, ADMITTED AT THE CARRIER TYPE.
#
# WHY BOTH, AND WHY NEITHER SUFFICES ALONE.
# I4's `tests/control_b_defeq_insufficiency.rs` executes the proof that kernel
# defeq does NOT subsume representation faithfulness: `UInt64.toNat (UInt64.ofNat
# (2^64))` is defeq to `0` against the real `clean_kernel::TypeChecker`, so a
# defeq-only gate admits a term whose emitted value wrapped. The carrier
# obligation catches that and does not consult the kernel. Conversely the
# carrier says nothing about whether the LOWERING was faithful — that is what
# the kernel decides. The gate therefore requires a `Carrier` (which I4 seals
# so it cannot exist without `CarrierEvidence::Total`) *and* a kernel verdict.
#
# THE DEPENDENCY LIST IS PART OF THE ARGUMENT.
# `clean-kernel` is here because the faithfulness question must be put to the
# REAL checker, never a Rust imitation of one. `clean-auto` is proof SEARCH for
# the symbolic-recursion fallback: it returns a real recursor term which this
# crate independently kernel-checks and audits for no non-foundational
# domain/trust assumptions. It
# is not part of the TCB and cannot itself mint `Faithful`.
# `trust-clean-carrier` is here because the gate's admitted statement is at the
# CARRIER type. `trust-symbols` is here because the mint decision reads
# `KernelStatus` and `AxiomClosure`. There is no parser or oracle: this crate
# decides admissibility and faithfulness from kernel-checkable terms.

[package]
name = "trust-clean-origin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Clean-origin CALL lane (I5): the gated DefId-mint decision and the carrier-typed faithfulness gate."

[lints]
workspace = true

[dependencies]
# Exactly eight. The seventh is the structural digest codec below; the eighth
# is clean-compiler, below. The composed Boolean lane reuses the canonical E6
# importer in trust-spec-elab, without a verification-manager dependency.
clean-kernel = { workspace = true }
clean-auto = { workspace = true }
# The EIGHTH (Clean R80; docs/DECISION_QUEUE.md R80-CONSUMERS-1): this lane
# plans from kernel values, so it must refuse what Clean's compiled lanes refuse
# about `@[implemented_by]`, and the ORDER record those lanes refuse on lives in
# an environment extension only clean-compiler can read
# (`clean_compiler::implemented_by_order`). Read-only and default features: no
# lowering is called. Not a new crate in the graph: trust-certify (below) and
# rustc_mir_transform already link it, and Cargo unifies the one copy, which
# the record needs (a second copy would read an empty record).
clean-compiler = { workspace = true }
trust-clean-carrier = { path = "../trust-clean-carrier" }
trust-symbols = { path = "../trust-symbols" }
trust-types = { path = "../trust-types", default-features = false }
# The SIXTH, added with `emit.rs`: side B's producer. `admit_projection_function`
# reflects the EMITTED body back into a Clean term, and it is the same function
# the E6 Rust->Clean kernel-import lane has always used — which is exactly why
# the comparison is not co-authored. It is a dependency of this crate, never a
# thing this crate may edit to make a Clean-origin body agree; doing so would
# turn the gate into a round trip. See `emit.rs`'s module docs.
trust-spec-elab = { path = "../trust-spec-elab" }
# Pinned workspace bincode 1: structural serde, fixed-width little-endian fields.
# A codec only; it does not check terms or confer proof authority.
bincode = { workspace = true }

[dev-dependencies]
# TESTS ONLY: probe_i3 pins the planner against the REAL island
# elaboration — the C9 spelling gap proved hand-built side-A terms can admit
# while the term the elaborator actually produces refuses. No cycle:
# trust-certify does not depend on this crate.
trust-certify = { path = "../trust-certify" }
serde_json = { workspace = true }
