#
# trust-bincode — the Trust-owned bincode 1.x wire format.
#
# WHY THIS CRATE EXISTS.
# `bincode 1.3.3`'s manifest reads
#
#     [dependencies.serde]
#     version = "1.0.63"
#
# with NO `optional = true` and no feature gate (its only feature is `i128`).
# It is therefore an UNCONDITIONAL third-party `serde` blocker in the `crates/`
# shipping closure: no feature flag can remove it, so the edge can only be
# retired by replacing the package. That is what this crate is for.
#
# `bincode 2.0.1` is a DIFFERENT problem and is deliberately out of scope here:
# its `serde` dependency IS optional, so it is a feature-flag question, not a
# replacement question.
#
# THE DEPENDENCY LIST IS ONE LINE, AND THAT LINE IS DELIBERATE.
# `serde` is here as a TRAIT ABI, not as a data format — exactly the shape
# `crates/trust-toml` established. This crate implements `serde::Serializer`
# and `serde::Deserializer` so every consumer keeps its existing
# `#[derive(Serialize, Deserialize)]` and compiles verbatim under a
# `package = ` rename. Replacing `serde` itself is a separate, larger phase
# that is atomic across `crates/` and at least six `first-party/*`
# repositories.
#
# `derive` is NOT enabled on the shipping dependency: this crate derives
# nothing itself, so `serde_derive`/`syn` stay out of its own subtree. The
# dev-dependency below turns `derive` on for the test binaries only, because
# the whole integration mechanism is "consumers keep their derives" and a gate
# that never exercises a derive would not be testing it. (Cargo's v2+ resolver
# does not unify dev-dependency features into a normal build.)
#
# WHAT IS IMPLEMENTED — READ THIS BEFORE WIRING A CONSUMER.
# The full drop-in surface the 34 in-`crates/` call sites and the 11 in
# `first-party/trust-ir` use: `serialize`, `deserialize`, `serialized_size`,
# the `Options` builder trait and `DefaultOptions`, plus `serialize_into` /
# `deserialize_from` and the `Serializer` / `Deserializer` / `BincodeRead`
# types. It reproduces the incumbent's DEFAULTS exactly, including the trap
# that the free functions are fixint+allow-trailing while `DefaultOptions::new()`
# alone is VARINT+reject-trailing.
#
# NOT implemented, deliberately: the deprecated legacy `bincode::config()` /
# `Config` builder (`config/legacy.rs` in the incumbent). No caller in this
# tree uses it. See `src/lib.rs` for the full divergence list.
#
# THIS CRATE IS INERT. Nothing depends on it yet; it is a workspace member so
# it is built and tested here. The swap onto `trust-certify`, `trust-clean`,
# `trust-proof-cert` and `trust-types` is a separate, deliberate step, and it
# must not be done by a graph-wide `[patch.crates-io] bincode` while the
# acceptance gate below still needs the incumbent's own bytes — see the
# `sha2` precedent in `crates/Cargo.toml`, where exactly that patch made a
# differential compare a crate to ITSELF and report green.

[package]
name = "trust-bincode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Trust-owned bincode 1.x-compatible binary format with real serde Serializer/Deserializer. No third-party dependencies beyond the serde trait ABI."

[lints]
workspace = true

[dependencies]
# The serde TRAIT ABI, and nothing else. See the header.
serde = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# `serde` again, this time WITH `derive`, and only here. The golden
# differential drives `#[derive(Serialize, Deserialize)]` types through this
# implementation and compares against bytes captured from the real incumbent
# (`tests/fixtures/bincode1_golden.json`).
#
serde = { version = "1", features = ["derive"] }
# The golden fixture's JSON reader, and ONLY that.
#
# TEST-ONLY, like everything else in this section. `serde_json` is already in
# `crates/Cargo.lock` (1.0.151) with many parents, so this adds a dev EDGE and
# not a package, and a dev edge is not in the shipping closure — which is the
# only closure this crate exists to shrink. Verify with the same
# `targo metadata` recipe the incumbent block below spells out.
#
# `workspace = true` is safe HERE where `crates/trust-toml` warns against it
# for its incumbent dev-dep: that warning is about a COMPARAND being captured
# by a graph-wide `[patch.crates-io]` and silently making a differential
# compare a crate to itself. serde_json is not a comparand — it only READS
# `tests/fixtures/bincode1_golden.json`. The bytes under test come from
# `trust-bincode`; the bytes compared against were produced by the real
# `bincode 1.3.3` and are already frozen in that committed file.
#
# It also buys a point of fidelity: the fixture's `deserialize_any` case was
# captured with `serde_json::Value`, and `tests/golden_bincode1.rs` now drives
# that exact type rather than a hand-written stand-in.
serde_json = { workspace = true }

# ---------------------------------------------------------------------------
# THE INCUMBENT — DEV-DEPENDENCY ONLY. IT MUST NEVER ENTER THE SHIPPING
# CLOSURE.
# ---------------------------------------------------------------------------
# The whole point of this crate is to remove `bincode 1.3.3` from the `crates/`
# shipping graph, because its manifest declares `serde` NON-OPTIONAL and
# UNGATED and is therefore a third-party `serde` blocker no feature flag can
# retire. Depending on it here would defeat that — so it is a
# `[dev-dependencies]` entry and nothing else.
#
# Cargo's rule that makes this safe: a dev-dependency is built ONLY for this
# package's own test/bench/example targets. It is not part of this library's
# published dependency set, it is not linked into `libtrust_bincode.rlib`, and
# it cannot reach a consumer of this crate. Nothing under `crates/` depends on
# `trust-bincode` today in any case (the crate is deliberately inert), but the
# invariant must hold when the consumers ARE wired.
#
# VERIFY IT, do not assume it:
#
#   cd crates && targo metadata --format-version 1 \
#       --filter-platform aarch64-apple-darwin
#
# and read the `resolve.nodes[]` entry whose `id` is `trust-bincode`: its `deps`
# edge to `bincode` must carry `"dep_kinds": [{"kind": "dev", ...}]` and MUST
# NOT carry a `null` (= normal) kind. `tests/differential_vs_incumbent.rs`
# documents the exact jq that answers this.
#
# It exists so `tests/differential_vs_incumbent.rs` can compare this
# implementation against the LIVE incumbent on thousands of deterministically
# generated values — which is strictly stronger than the committed golden
# fixture, because a fixture can only ever pin the cases someone thought to
# capture.
#
# This must NOT become a `[patch.crates-io] bincode` (see `crates/Cargo.toml`
# and the `sha2` precedent): a graph-wide patch would make the differential
# compare this crate to ITSELF and report green.
#
# AND — the reason this is a hard version and NOT `{ workspace = true }` —
# neither may it inherit from `[workspace.dependencies]`. The swap that retires
# the incumbent is a dependency RENAME, which is exactly an edit to that table:
#
#     # crates/Cargo.toml, after the swap
#     bincode = { package = "trust-bincode", path = "trust-bincode" }
#
# The moment that lands, a `{ workspace = true }` dev-dep here resolves to
# `trust-bincode` itself. The differential then compares this crate to itself
# across every one of its generated values and stays GREEN — permanently, and
# silently, with no error and no missing symbol to notice. That is the same
# vacuous-gate failure this repo has already measured once, and it would land
# precisely when the gate matters most: the commit that removes the incumbent.
#
# A literal version requirement is resolved from the registry by name and is
# unaffected by `[workspace.dependencies]`, so it survives the rename intact.
# `tests/differential_vs_incumbent.rs` additionally asserts at runtime that the
# two implementations are distinct types, so if this line is ever "tidied" back
# into the workspace table the harness fails loudly instead of going vacuous.
bincode = "1.3.3"
