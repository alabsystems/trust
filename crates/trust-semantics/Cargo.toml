# trust-semantics: clean-kernel definitions for Trust's safety predicates.
#
# Stage 1 of PROOF_OF_PERFECTION.md: replace opaque `const_str` placeholders for
# safety predicates (e.g. RustVIR.noOverflow) with REAL clean-kernel Definitions
# the kernel understands, and emit the matching violation Formula in the exact
# shape trust-vcgen's range.rs builds. Fail-closed: overflow_safety_env returns
# None if the kernel rejects the definition.
