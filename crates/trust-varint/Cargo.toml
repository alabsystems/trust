# trust-varint: total, verified LEB128 / varint / length-prefix decoding.
#
# Sixth `crates/`-resident component written to PASS the authenticated strict
# lane rather than to be retrofitted onto it, on the same discipline as
# `trust-ratio`, `trust-hex`, `trust-utf`, `trust-endian` and `trust-index`: no dependencies,
# `#![no_std]`, no `derive`, no `impl Display`, no allocation, no loops, no
# slices.
