[package]
name = "trust-stage-receipt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
description = "Native checked reading of Trust stage receipts without provenance authority"

[dependencies]
trust-json = { path = "../trust-json" }
trust-sha2 = { path = "../trust-sha2", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
errno = "0.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace]
