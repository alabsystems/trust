# trust-decompile: Minimal binary decompiler API
#
# Owns the public decompile_binary(bytes, options) surface and artifact schema.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache 2.0

[package]
name = "trust-decompile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Both parsers on by default. `macho` was left out of the default from the
# initial commit (06efaa37ef), alongside trust-lift's note that
# trust-binary-parse "has pre-existing compile issues". That note was measured
# false 2026-09-27; see trust-lift/Cargo.toml. trust-binary-parse is already a
# non-optional dependency here, so `macho` adds only trust-lift's Mach-O path.
default = ["elf", "macho"]
elf = ["trust-lift/elf"]
macho = ["trust-lift/macho"]
trust-cg = ["dep:trust-cg-bridge"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
trust-lift = { workspace = true }
trust-binary-parse = { workspace = true }
trust-types = { workspace = true }
trust-cg-bridge = { workspace = true, optional = true }
trust-ir = { workspace = true }
trust-ir-bridge = { workspace = true }
trust-wasm-bridge = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The unit tests run under serde_json/preserve_order, which every targo-trust
# build has through trust-certify (f2c4e2ccce), so the rendered-text key-order
# test checks the configuration that ships rather than passing vacuously.
serde_json = { workspace = true, features = ["preserve_order"] }
