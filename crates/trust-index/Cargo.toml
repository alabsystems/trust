# trust-index: total, verified bounded-index / ring / slice-range arithmetic.
#
# Fifth `crates/`-resident component written to PASS the authenticated strict
# lane rather than to be retrofitted onto it, on the same discipline as
# `trust-ratio`, `trust-hex`, `trust-utf` and `trust-endian`: no dependencies,
# `#![no_std]`, no `derive`, no `impl Display`, no allocation, no loops, no
# mutable slices.
