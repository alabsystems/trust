[package]
name = "trust-verifier-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# trust: canonical home of the proof-assurance vocabulary (AssuranceLevel,
# ProofStrength, ReasoningKind, TrustSpecVariableOrigin). Re-exported below so
# dependents are unchanged; the leaf crate lets backends (clean) share these
# enums without depending on the Trust repo.
trust-ir-contract = { workspace = true }
# trust: the digest/canonical-JSON primitives. This crate defines a WIRE, and a
# wire's identity is the bytes its producer hashed — keeping a private copy of
# the canonicalizer here is how the two ends of the same envelope come to
# disagree about what a payload is.
trust-types = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
