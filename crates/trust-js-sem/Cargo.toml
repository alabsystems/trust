# trust-js-sem: the independent ECMA-262 reference semantics (S0 surface)
#
# The third oracle head: an independent semantics of what JavaScript is
# SUPPOSED to mean, evaluating the S0 slice (statements/expressions incl.
# for-in/for-of and template literals, the property-descriptor machinery,
# the arguments object, wrappers, call/apply/bind, the exact Math subset,
# Array/String prototype methods) and emitting the same ObservableTrace
# every other head emits. Anything outside the implemented slice — or inside
# engine/spec latitude — is a sound `NoCoverage`, never a false divergence
# and never a silent pass. FULL S0 coverage is not claimed; the Clean
# denotation is RESEARCH.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: MIT OR Apache-2.0

