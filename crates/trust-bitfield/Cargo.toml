# trust-bitfield: fixed-width bit fields inside a machine word, as descriptors.
#
# The first Trust-owned component built ON TOP of another verified Trust crate:
# every power of two, every low mask and both mask/descriptor readings come from
# `trust-bits`. The dependency below is load-bearing — delete it and the crate
# does not compile, and there is nothing to copy back in.
