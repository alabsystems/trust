# trust-wp: standalone compatibility boundary for the trust-wp deductive verifier
#
# Exposes explicit standalone diagnostic and historical inspection APIs. It is
# not called by Trust's compiler/full-verifier pass. The historical architecture
# is documented in designs/2026-04-25-trust-contracts-first-class-target.md.
#
# Retains transitional standalone types (ContractSet, TrustWpResult,
# LoopInvariant), a TrustWpBackend trait, and historical wire inspectors. The
# CliBackend is standalone diagnostic compatibility only. TrustWP advertises no
# compiler/full-verifier proof kind and grants no publication authority.
#
# Default builds do not depend on trust-wp-core. `trust-build` compiles
# historical native inspection/conformance support; it does not restore a
# routed verifier capability.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache 2.0

[package]
name = "trust-wp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# trust #790: `trust-build` compiles historical native inspection/conformance
# support against the first-party TrustWP crates. The public verifier remains
# zero-capability and cannot authorize a verdict in either feature mode.
trust-build = ["dep:trust-wp-core", "dep:trust-wp-ay", "dep:trust-ir"]

[dependencies]
trust-types = { workspace = true }
trust-verifier-api = { workspace = true }
# trust: deadline-bounded child processes (own process group, group kill).
trust-os = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
trust-wp-core = { workspace = true, optional = true }
trust-wp-ay = { workspace = true, optional = true }
trust-ir = { workspace = true, features = ["serde"], optional = true }
