[package]
name = "trust-proc-macro-bridge"
version = "0.1.0"
edition = "2024"
workspace = "../.."
license = "MIT OR Apache-2.0"
description = "Worker-side native proc_macro ABI forwarding over the bounded B1 protocol"

[dependencies]
rustc_proc_macro = { path = "../../compiler/rustc_proc_macro" }
trust-process-isolation = { path = "../trust-process-isolation" }

[lints]
workspace = true

# Native calls implement bounded socket I/O and explicit status readback.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }
