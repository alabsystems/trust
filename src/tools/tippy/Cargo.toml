[package]
name = "tippy"
version = "0.1.101"
description = "Trust's lint checker, carrying the Rust Clippy lint suite"
repository = "https://github.com/alabsystems/trust"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["tippy", "clippy", "lint", "plugin"]
categories = ["development-tools", "development-tools::cargo-plugins"]
build = "build.rs"
edition = "2024"
publish = false

[[bin]]
name = "cargo-clippy"
path = "src/main.rs"

[[bin]]
name = "clippy-driver"
path = "src/driver.rs"

[dependencies]
clippy_config = { path = "clippy_config" }
clippy_lints = { path = "clippy_lints" }
clippy_utils = { path = "clippy_utils" }
declare_clippy_lint = { path = "declare_clippy_lint" }
rustc_tools_util = { path = "rustc_tools_util", version = "0.4.2" }
clippy_lints_internal = { path = "clippy_lints_internal", optional = true }
color-print = "0.3.4"
anstream = "0.6.18"
# Trust: preserve the inherited scheduler at the authenticated Cargo boundary.
jobserver_utils = { path = "../../jobserver_utils" }

[dev-dependencies]
cargo_metadata = "0.23"
ui_test = "0.30.7"
regex = "1.5.5"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.122"
walkdir = "2.3"
itertools = "0.15"
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
askama = { version = "0.16.1", default-features = false, features = ["alloc", "config", "derive"] }
tempfile = "3.20"

[target.'cfg(unix)'.dev-dependencies]
# Trust: real descriptor canaries at the frontend's child boundary.
libc = "0.2"

[dev-dependencies.toml]
version = "1.1"
default-features = false
# preserve_order keeps diagnostic output in file order
features = ["parse", "preserve_order", "serde"]

[build-dependencies]
rustc_tools_util = { path = "rustc_tools_util", version = "0.4.2" }

[features]
integration = []
internal = ["dep:clippy_lints_internal"]

[package.metadata.rust-analyzer]
# This package uses #[feature(rustc_private)]
rustc_private = true

[[test]]
name = "compile-test"
harness = false

[[test]]
name = "dogfood"
harness = false

# Security-boundary process tests are an explicit Cargo target so the
# load-bearing executable-identity coverage cannot silently disappear if test
# target auto-discovery is changed.
[[test]]
name = "boundary_args"
path = "tests/boundary_args.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(bootstrap)']
