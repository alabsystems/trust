[package]
# Trust: this package is the executable and public facade; targo-core owns
# the reusable engine. No Trust build compiles `--crate-name cargo`. Only the `cargo` COMPATIBILITY
# entry point keeps the stock name: bootstrap lays it down as a copy of the
# `targo` executable (docs/trust-naming.md, "What is still spelled `cargo`").
# The source layout (`src/bin/cargo/`) is inherited from upstream and
# deliberately left in place, hence the explicit paths below.
name = "targo"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.99"  # MSRV:1
homepage = "https://doc.rust-lang.org/cargo/index.html"
repository.workspace = true
documentation = "https://docs.rs/cargo"
description = """
Targo, the Trust package manager: Cargo for the Trust toolchain.
"""

[lib]
name = "targo"

[dependencies]
trust-test-execution.workspace = true
targo-core = { path = "crates/targo-core", default-features = false }
anyhow.workspace = true
cargo-credential.workspace = true
cargo-util-schemas.workspace = true
cargo-util-terminal.workspace = true
cargo-util.workspace = true
clap = { workspace = true, features = ["wrap_help"] }
clap_complete.workspace = true
color-print.workspace = true
curl = { workspace = true, features = ["http2"] }
curl-sys.workspace = true
flate2.workspace = true
git2.workspace = true
http.workspace = true
itertools.workspace = true
jiff = { workspace = true, features = ["serde", "std"] }
# Trust: the private epoch helper uses the same qualified GNU transport as builds.
jobserver.workspace = true
os_info.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true # Trust: bounded private epoch control frames.
tar.workspace = true
tempfile.workspace = true
time.workspace = true
toml_edit.workspace = true
tracing = { workspace = true, features = ["attributes"] }
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
unicode-ident.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Trust: native fixed admission is production Targo software, not a test helper.
trust-build-tree = { path = "../../../crates/trust-build-tree", features = ["machine-admission", "native-exec"] }
# Trust: manual cache maintenance uses the same native Bootstrap engine on Unix.
bootstrap = { path = "../../bootstrap", features = ["native-cache-exec"] }

[target.'cfg(target_os = "linux")'.dependencies]
cargo-credential-libsecret.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cargo-credential-macos-keychain.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Trust: actual managed Targo calls the maintained engine in-process. No
# standalone Bootstrap image or saved build record supplies Host authority.
trust-resource-controller = { path = "../../../crates/trust-resource-controller", features = ["client"] }
trust-resource-provenance = { path = "../../../crates/trust-resource-provenance" }

[target.'cfg(not(windows))'.dependencies]
openssl = { workspace = true, optional = true }
openssl-src = { workspace = true, optional = true }
# Trust: keep the maintained startup-owned caller selected on lock updates.
openssl-sys = { version = "=0.9.117", optional = true }

[target.'cfg(windows)'.dependencies]
cargo-credential-wincred.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

[dev-dependencies]
trust-qualification = { path = "../../../crates/trust-qualification" }
trust-build-cpu = { path = "../../../crates/trust-build-cpu" } # Trust: retained epoch backing.
trust-fs-observation = { path = "../../../crates/trust-fs-observation" } # Trust: strict producer-data decoder.
annotate-snippets = { workspace = true, features = ["testing-colors"] }
cargo-test-support.workspace = true
gix = { workspace = true, features = ["revision"] }
# When building Cargo for tests, a safety-measure in `gix` needs to be disabled
# to allow sending credentials over HTTP connections.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }
same-file.workspace = true
snapbox.workspace = true

filetime.workspace = true
glob.workspace = true
hex.workspace = true
memchr.workspace = true
rand.workspace = true
regex.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true, features = ["std", "serde", "parse", "display", "preserve_order"] }
url.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Trust: the development Git fixture uses the existing early-capture SDK client.
trust-resource-controller = { path = "../../../crates/trust-resource-controller", features = ["client"] }
memfd.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
trust-resource-controller = { path = "../../../crates/trust-resource-controller", features = ["client"] }

[build-dependencies]
build-rs.workspace = true
flate2.workspace = true
tar.workspace = true

[[bin]]
name = "targo"
path = "src/bin/cargo/main.rs"
# Trust: upstream disables the binary's test harness because `bin/cargo` is pure
# dispatch. Trust's frontend-identity and lane-authorization checks live there and
# cannot be observed from a testsuite binary, so the harness stays wired in.
test = true
doc = false

# Trust: explicit development fixture; never a shipped compiler or admission tool.
[[example]]
name = "cache-git-fixture"
path = "examples/cache-git-fixture.rs"

# Private whole-consumer image: the ordinary frontend stays byte-for-byte
# sourced from its maintained entry, with Initial support declared only here.
# This is never installed as a compiler/SDK or used by ordinary source builds.
[[example]]
name = "initial-workload-sdk"
path = "examples/initial-workload-sdk.rs"

[features]
default = ["http-transport-curl"]
# Explicit live-machine diagnostic: takes an ordinary canonical fixed claim.
fixed-admission-system-tests = []
vendored-openssl = ["targo-core/vendored-openssl"]
vendored-libgit2 = ["targo-core/vendored-libgit2"]
all-static = ["targo-core/all-static"]
http-transport-curl = ["targo-core/http-transport-curl"]
http-transport-reqwest = ["targo-core/http-transport-reqwest"]

[[test]]
name = "fixed_admission"
path = "tests/fixed_admission.rs"
required-features = ["fixed-admission-system-tests"]

[[test]]
name = "native_improvement_workload"
path = "tests/native_improvement_workload.rs"
# Trust: scheduler and SDK originals must be captured before libtest can open FDs.
harness = false

[lints]
workspace = true

# Workaround: trustc's codegen SIGBUSes on ed25519-compact v2.3.1 (transitive via
# pasetors). Compiling it without optimization avoids the crashing LLVM pass; this
# crate is a build-tool dependency, so unoptimized codegen is harmless. (#trust-sigbus)
[profile.release.package.ed25519-compact]
opt-level = 0
codegen-units = 1
[profile.dev.package.ed25519-compact]
opt-level = 0
codegen-units = 1

# Compiler/runtime identity hashes large binaries even in developer builds.
# Keep this shared digest implementation optimized; release already is.
[profile.dev.package.blake3]
opt-level = 3

# Trust: selected Git checkout validation spends its time in this checked
# SHA-1 kernel in debug builds. Optimize the same collision-detecting code;
# retain the developer profile's assertions and overflow checks.
[profile.dev.package.sha1-checked]
opt-level = 3

# Native input custody streams complete runtime bytes. Keep its SHA256 kernel
# optimized just like the existing fingerprint kernel, without changing keys.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

# Trust: `cargo_util::Sha256` is sha2 0.11, and it is what hashes a test
# executable before an authenticated or prepared launch (three passes over the
# image). Unoptimized it takes about 6 s per pass over a 0.5 GB debug harness,
# which is longer than the 10 s the cancellation tests wait for their harness
# to start. Same digest, same keys.
[profile.dev.package."sha2:0.11.1"]
opt-level = 3
