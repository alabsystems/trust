[package]
name = "targo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.99"
repository.workspace = true
publish = false
description = "Reusable native Targo compilation and verification engine"

[dependencies]
trust-test-execution.workspace = true
trust-fs-observation = { path = "../../../../../crates/trust-fs-observation" }
trust-proof-session = { path = "../../../../../crates/trust-proof-session" }
trust-certify = { path = "../../../../../crates/trust-certify" }
trust-types = { path = "../../../../../crates/trust-types" }
anstream.workspace = true
anstyle.workspace = true
anstyle-progress.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
cargo-credential.workspace = true
cargo-platform.workspace = true
cargo-util-schemas.workspace = true
cargo-util-terminal.workspace = true
cargo-util.workspace = true
clap = { workspace = true, features = ["wrap_help"] }
clap_complete.workspace = true
color-print.workspace = true
crates-io.workspace = true
curl = { workspace = true, features = ["http2"] }
curl-sys.workspace = true
filetime.workspace = true
flate2.workspace = true
futures.workspace = true
futures-timer.workspace = true
git2.workspace = true
git2-curl.workspace = true
gix.workspace = true
glob.workspace = true
heck.workspace = true
hex.workspace = true
hmac.workspace = true
home.workspace = true
http.workspace = true
http-auth.workspace = true
ignore.workspace = true
im-rc.workspace = true
indexmap.workspace = true
itertools.workspace = true
jiff = { workspace = true, features = ["serde", "std"] }
jobserver.workspace = true
libgit2-sys.workspace = true
memchr.workspace = true
opener.workspace = true
os_info.workspace = true
pathdiff.workspace = true
portable-atomic.workspace = true
rand.workspace = true
rayon.workspace = true
regex.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
rustc-hash.workspace = true
rustc-stable-hash.workspace = true
rustfix.workspace = true
same-file.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-untagged.workspace = true
serde_ignored.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha1.workspace = true
sha2.workspace = true
shell-escape.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
toml = { workspace = true, features = ["std", "serde", "parse", "display", "preserve_order"] }
toml_edit.workspace = true
toml_parser.workspace = true
toml_writer.workspace = true
tracing = { workspace = true, features = ["attributes"] }
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
unicase.workspace = true
unicode-width.workspace = true
unicode-ident.workspace = true
url.workspace = true
walkdir.workspace = true
winnow.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# Trust: original-dirfd source DATA traversal and creation, never a path resolver.
rustix.workspace = true
# Trust: the distinct metadata entry consumes native custody, not test admission.
trust-resource-controller = { path = "../../../../../crates/trust-resource-controller", features = ["client"] }
trust-resource-provenance = { path = "../../../../../crates/trust-resource-provenance" }
trust-qualification = { path = "../../../../../crates/trust-qualification", features = ["native-repository"] }

[target.'cfg(target_os = "linux")'.dependencies]
cargo-credential-libsecret.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cargo-credential-macos-keychain.workspace = true

# Trust: the original Root's existing library engine owns its actual source,
# output and native continuation. Bootstrap never depends on targo-core; this
# target-scoped adapter consumes that opaque owner instead of recreating it.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
bootstrap = { path = "../../../../../src/bootstrap" }

[target.'cfg(not(windows))'.dependencies]
openssl = { workspace = true, optional = true }
openssl-src = { workspace = true, optional = true }
# Trust: keep the maintained startup-owned caller selected on lock updates.
openssl-sys = { version = "=0.9.117", optional = true }

[target.'cfg(windows)'.dependencies]
cargo-credential-wincred.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

[dev-dependencies]
trust-fs-observation = { path = "../../../../../crates/trust-fs-observation", features = ["test-support"] }
annotate-snippets = { workspace = true, features = ["testing-colors"] }
cargo-test-support.workspace = true
gix = { workspace = true, features = ["revision"] }
# When building Cargo for tests, a safety-measure in `gix` needs to be disabled
# to allow sending credentials over HTTP connections.
gix-transport = { workspace = true, features = ["http-client-insecure-credentials"] }
same-file.workspace = true
snapbox.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
memfd.workspace = true

[features]
default = ["http-transport-curl"]
vendored-openssl = ["openssl/vendored", "dep:openssl-sys"]
vendored-libgit2 = ["libgit2-sys/vendored"]
# This is primarily used by inherited Rust/Trust bootstrap when distributing cargo the executable.
all-static = ['vendored-openssl', 'curl/static-curl', 'curl/force-system-lib-on-osx', 'vendored-libgit2']
# Exactly one of 'http-transport-curl' or 'http-transport-reqwest' must be enabled
# when using Cargo as a library. By default, it is 'http-transport-curl'.
http-transport-curl = ["gix/blocking-http-transport-curl"]
http-transport-reqwest = ["gix/blocking-http-transport-reqwest"]

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
trust-build-tree = { path = "../../../../../crates/trust-build-tree", features = ["machine-admission"] }
trust-build-cpu = { path = "../../../../../crates/trust-build-cpu", features = ["observations", "jobserver", "member", "native-host"] }
jobserver_utils = { path = "../../../../jobserver_utils" }
trust-resource-controller = { path = "../../../../../crates/trust-resource-controller", features = ["client"] }
trust-resource-provenance = { path = "../../../../../crates/trust-resource-provenance" }
