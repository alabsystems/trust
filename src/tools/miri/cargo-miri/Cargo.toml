[package]
description = "An experimental interpreter for Rust MIR (cargo wrapper)."
license = "MIT OR Apache-2.0"
name = "cargo-miri"
repository = "https://github.com/rust-lang/miri"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-miri"
path = "src/main.rs"
test = false # we have no unit tests
doctest = false # and no doc tests

[dependencies]
directories = "6"
rustc_version = "0.4"
serde_json = "1.0.40"
cargo_metadata = "0.23"
rustc-build-sysroot = "0.5.13"

# Enable some feature flags that dev-dependencies need but dependencies
# do not.  This makes `./miri install` after `./miri build` faster.
# Require a version of serde without intransparent unreproducible binary blobs.
serde = { version = "1.0.185", features = ["derive"] }

[build-dependencies]
# Trust: this build script must query the RUSTC Cargo selected, rather than a
# bare ambient rustc. Name Tippy's existing implementation at the consumer;
# a global patch is unused in the crates workspace and the pinned bootstrap
# Cargo serializes different unused patches in nondeterministic order.
rustc_tools_util = { version = "0.4", path = "../../tippy/rustc_tools_util" }
