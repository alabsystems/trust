[package]
name = "shim_utils"
version = "0.0.0"
edition = "2024"

# Every dependency of this crate becomes a transitive dependency of bootstrap
# (and some other tools), so try to avoid dependencies that are slow to build.
[dependencies]
# tidy-alphabetical-start
# Trust: scheduling transport shared with native Targo, without its policy.
jobserver_utils = { path = "../jobserver_utils" }
# Trust: the shim helpers ported from bootstrap parse shell argfiles (shlex)
# and the cargo-test shim sidecar config (serde_json).
serde_json = "1.0"
shlex = "1.3.0"
tempfile = "3.23.0"
# tidy-alphabetical-end
