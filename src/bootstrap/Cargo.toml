[package]
name = "bootstrap"
version = "0.0.0"
edition = "2024"
build = "build.rs"
default-run = "bootstrap"

[features]
# Explicit actual old/current administrative frontdoor qualification; missing inputs fail.
native-cli-tests = []
native-cache-exec = ["build_helper/native-exec"]
build-metrics = ["dep:sysinfo", "build_helper/metrics"]
tracing = ["dep:tracing", "dep:tracing-chrome", "dep:tracing-subscriber", "dep:chrono"]

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "bootstrap"
path = "src/bin/main.rs"
test = false

[[bin]]
name = "rustc"
path = "src/bin/rustc.rs"
test = true

[[bin]]
name = "rustdoc"
path = "src/bin/rustdoc.rs"
test = true

[dependencies]
# Most of the time updating these dependencies requires modifications to the
# bootstrap codebase(e.g., https://github.com/rust-lang/rust/issues/124565);
# otherwise, some targets will fail. That's why these dependencies are explicitly pinned.
cc = "=1.2.62"
cmake = { package = "trust-cmake", path = "../../crates/trust-cmake" }

# tidy-alphabetical-start
build_helper = { path = "../build_helper", features = ["machine-admission", "resident-inputs"] }
clap = { version = "4.4", default-features = false, features = ["std", "usage", "help", "derive", "error-context"] }
clap_complete = "4.4"
home = "0.5"
ignore = "0.4"
# Trust: production Host graph ownership checks the original GNU transport witnesses.
jobserver = "=0.1.35"
jobserver_utils = { path = "../jobserver_utils" }
libc = "0.2"
# Trust: scan proc-macro symbol candidates without an O0 iterator at every byte.
memchr = "2.8"
object = { version = "0.39.1", default-features = false, features = ["archive", "coff", "macho", "read_core", "std", "unaligned"] }
opener = "0.8"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Directly use serde_derive rather than through the derive feature of serde to allow building both
# in parallel and to allow serde_json and toml to start building as soon as serde has been built.
serde_derive = "1.0"
serde_json = "1.0"
sha2 = "0.10"
shim_utils = { path = "../shim_utils" }
shlex = "1.3.0"
tar = { version = "0.4.45", default-features = false }
# Used by `feature = "tracing"` and by tests, but is also a dependency of `shim_utils` anyway.
tempfile = "3.23"
termcolor = "1.4"
toml = "0.5"
walkdir = "2.4"
xz2 = "0.1"
# tidy-alphabetical-end

# Dependencies needed by the build-metrics feature
sysinfo = { version = "0.39.2", default-features = false, optional = true, features = ["system"] }

# Dependencies needed by the `tracing` feature
chrono = { version = "0.4", default-features = false, optional = true, features = ["now", "std"] }
tracing = { version = "0.1", optional = true, features = ["attributes"] }
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt", "registry", "std"] }

# The pinned sha2 release otherwise uses software SHA-256 on AArch64. Keep
# snapshot bytes and filesystem checks unchanged while using its existing
# CPU-feature-selected backend on this host platform.
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }
# Trust: native local Git identity for the no-fork original graph. This reads
# exact local refs/commit objects without shell, network, helpers or a Git child.
gix = { version = "=0.85.0", default-features = false, features = ["sha1"] }
trust-resource-provenance = { path = "../../crates/trust-resource-provenance" }
# Shared passive reader only; the original Host Graph wrapper stays in Bootstrap.
trust-committed-source = { path = "../../crates/trust-committed-source" }

# Trust: only the live completed native owner can offer original input custody.
# No saved runtime record or support observation constructs completion or SDK.
# utils/metadata_scheduler.rs uses this client wherever it is
# cfg(any(target_os = "macos", target_os = "linux")), so the dependency has that
# predicate too. Under the Apple-silicon table above (32e722797d) Bootstrap did
# not compile on Linux: E0433, six uses of `trust_resource_controller`.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
trust-resource-controller = { path = "../../crates/trust-resource-controller", default-features = false, features = ["client"] }

[target.'cfg(windows)'.dependencies.windows-registry]
version = "0.6"

[target.'cfg(windows)'.dependencies.junction]
version = "1.3.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[dev-dependencies]
expect-test = "1"

# We care a lot about bootstrap's compile times, so don't include debuginfo for
# dependencies, only bootstrap itself.
[profile.dev]
debug = 0

[profile.dev.package]
# Only use debuginfo=1 to further reduce compile times.
bootstrap.debug = 1
# Trust: optimize safe scalar scanning and source identity hashing without
# changing their bytes, validation, or bootstrap's overall dev profile.
memchr.opt-level = 2
sha2.opt-level = 3

# memchr is first-party. This workspace is EXCLUDED from the root workspace and
# carries its own lockfile, so the root [patch.crates-io] does not reach it —
# and this is the graph that `bootstrap_disables_default_trust_verification`
# leaves verification ON for, i.e. the one where upstream memchr fails.
[patch.crates-io]
# Trust: share the same explicit-pipe client type with jobserver_utils.
jobserver = { path = "../../vendor/jobserver" }
memchr = { path = "../../crates/trust-memchr" }
