# Trust workspace cargo config.
#
# No compiler selection and no verification flags live here: `targo` owns the
# verified/unverified lane and per-unit scope (CLAUDE.md "Consuming repos").
# The commented-out RUSTC_BOOTSTRAP allowlist and the trust-rustc-guard
# RUSTC_WRAPPER that sat in [env] were removed on 2026-09-28 (Trust for all ALab
# systems: docs/OWNER_RULINGS.md OW-37); `git log -p -- .cargo/config.toml` has them.
#
# Author: Andrew Yates <andrewyates.name@gmail.com>
# Copyright 2026 Andrew Yates | License: Apache 2.0
#
# Incremental-compilation scope split (cross-ref bootstrap.toml [rust] incremental):
#   bootstrap.toml sets `incremental = false`, but that knob is SCOPED to the
#   rustc self-build only (the stage1/stage2 compiler self-compilation, where an
#   interrupted incremental build once produced a corrupted-mmap SIGBUS). It does
#   NOT govern the Trust developer default-members. This config sets no
#   `[build] incremental`, so the developer library set keeps Cargo's default
#   `incremental = true` for fast crates-only iteration (`targo --unverified check`,
#   `targo --unverified test`). Do not "unify" these: the bootstrap disable is a
#   self-build stability fix, not a workspace-wide policy.

[build]
# One native target location for root, library-member and Targo entrypoints.
# Preserve the established developer cache; explicit target directories used
# by bootstrap and isolated qualification builds still override this default.
# Machine admission belongs to build-slot, which measures the current host and
# reserves its CPU share. A checked-in count from another machine must not cap
# native Targo on every host; explicit caller limits still take precedence.

# Some submodules under first-party/ reach the `alabsystems/ay` private
# repository through hard-pinned HTTPS git URLs in their own workspaces. Trust's
# top-level [patch] sections can't override deps inside another workspace, so
# cargo would otherwise try to clone the private repo over HTTPS and fail with
# "could not read Username" on developer machines that auth GitHub via SSH.
# Using the git CLI lets git's own credential helpers / SSH config resolve
# authentication (see also the url."git@github.com:".insteadOf entry in this
# repo's local git config, set up by ./scripts/bootstrap.sh).
[net]
git-fetch-with-cli = true

[env]
# The native_wp_body target imports trust-wp's bounded recursive controls.
# Match that workspace's debug-test stack default; nested Cargo configuration
# is not inherited here. Preserve an explicit caller's runtime stack setting.
RUST_MIN_STACK = { value = "16777216", force = false }
