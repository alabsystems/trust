# The landing gate's row table (docs/PLAN.md PKG-LIVE-4; docs/design/2026-11-12-live-edit-loop.md
# step 4 and section 5). One [[row]] per check: its id, the command that judges it, the paths
# whose change selects it, and the defect it exists to catch.
#
# Today it holds the validation rows only: one per tracked scripts/tests/*_test.py module.
# scripts/lib/land_select.py reads it at import and builds VALIDATION_PROGRAM_TESTS,
# VALIDATION_TEST_SUBJECTS, VALIDATION_UNJUDGED_MODULES and VALIDATION_UNMAPPED_RED from it (they
# were dict literals in that file until 2026-11-14), and refuses to load a table that breaks a
# rule below, or that is not a regular file in a real directory (a symbolic link here would name
# a file the gate neither hashes nor watches). No `targo trust land` engine reads this file yet;
# that is not on yet (PKG-LIVE-4).
# Editing this file selects what editing land_select.py selects (docs/LANDING_GATE.md).
#
#   schema   "trust.land-rows.v1". A reader refuses any other value, and any key it does not know.
#   covered  globs of tracked files (`*` stays inside one path component). Each such file is
#            exactly one [[row]] or exactly one [[not_run]]: never both, never neither
#            (land_select.land_rows_coverage; scripts/tests/land_gate_test.py holds the tree to it,
#            and the push row fast.land-rows-coverage, `land_gate.py rows --check`, the pushed commit).
#
# [[row]], sorted by id:
#   id             "validation.<module>" for scripts/tests/<module>.py.
#   command        the argv that judges the row, from the repository root. Exit 0 is PASS; every
#                  other exit is not PASS.
#   selects_on     the paths whose change selects the row, sorted. It is what SELECTS the row, not
#                  everything the test reads: a path here is the module's own file or something it
#                  imports, loads by path, executes, or copies from this tree as its program under
#                  test (and, for a module that only scans named files, those files). Data a module
#                  reads beside its program (lockfiles, compiler sources, ledgers, the tree it
#                  scans) is not listed and keeps its own selection. The selector also adds
#                  validation.mir_test_oracle_feature_test for any changed Cargo.toml, whatever its
#                  directory or letter case (land_select.validation_test_modules).
#   catches        the defect the row exists to catch: what would be wrong, and go unnoticed, were the
#                  row not run. Not the module's title: scripts/tests/land_gate_test.py refuses a text
#                  that only names its subject ("Tests for scripts/x.py.") or is not prose. That is a
#                  floor, not the meaning. A row whose text describes its controls ("Inert fixtures; no
#                  compiler runs.") passes the floor and still names no defect: such rows carry the
#                  opening line of their module's docstring, from when the table was made, and naming
#                  their defect is not done yet (docs/OPEN_ISSUES.md LAND-ROWS-CATCHES-1).
#   not_yet_targo  why the command is not yet a targo verb or a test target (section 5, rule 1).
#                  Required while it is not.
#
# [[not_run]], sorted by id: a covered file that nothing selects, and why.
#   path  the file.
#   kind  "unjudgeable": `land_gate.py validation-tests` cannot judge the module (a driver whose
#         command line names a built SDK, or a harness that reads a test binary from the
#         environment at import). Selecting one would make every landing that did so NOT JUDGED,
#         or a FAIL at import; land_gate_test holds each to still being unjudgeable.
#         "red": the module was red on main when the rest were mapped (2026-11-10, full checkout,
#         aarch64-apple-darwin; docs/OPEN_ISSUES.md VALIDATION-UNMAPPED-RED-1). Selecting one would
#         turn every landing that touches its subjects red for a cause the landing did not make.
#         To retire a row: make the module green, add its [[row]] (its own file, what it imports,
#         loads or executes), and delete the [[not_run]].
#   why   the reason; for "red", the exact failure.
#
# [validation_programs]: path = [row ids]. Read only by scripts/lib/land_select.py, and it goes
# when that file does. A path here is a validation program: changing it runs the listed rows, and
# the path is exempt from the rules that select every leg (a path under scripts/ otherwise selects
# every leg). A compiler or package that reads the path still reaches it through its own inputs.
# Every other selects_on path is additive: it adds its rows and keeps every other rule, so it
# never narrows a leg. The listed rows must be exactly the rows whose selects_on names the path;
# their order here is the order land_select reports them in.

schema = "trust.land-rows.v1"
covered = ["scripts/tests/*_test.py"]

