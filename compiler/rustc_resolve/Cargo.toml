[package]
name = "rustc_resolve"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
indexmap = "2.4.0"
itertools = "0.15"
pulldown-cmark = { version = "0.11", features = [
    "html",
], default-features = false }
rustc_arena = { path = "../rustc_arena" }
rustc_ast = { path = "../rustc_ast" }
rustc_ast_pretty = { path = "../rustc_ast_pretty" }
rustc_attr_parsing = { path = "../rustc_attr_parsing" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_errors = { path = "../rustc_errors" }
rustc_expand = { path = "../rustc_expand" }
rustc_feature = { path = "../rustc_feature" }
rustc_hir = { path = "../rustc_hir" }
rustc_index = { path = "../rustc_index" }
rustc_macros = { path = "../rustc_macros" }
rustc_metadata = { path = "../rustc_metadata" }
rustc_middle = { path = "../rustc_middle" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
thin-vec = "0.2.18"
tracing = "0.1"
# tidy-alphabetical-end

# Trust (I5): the Clean-origin mint decision runs at the root-fragment seam in
# `src/trust_clean_origin.rs`, because the three mint preconditions
# (`KernelChecked`, audited-empty axiom closure, total carrier) are facts about
# the crate's Clean ENVIRONMENT and `def_collector` is the only point where the
# answer changes anything.
#
# THE COST IS REAL AND IS STATED HERE. §8 of
# `docs/design/2026-08-04-two-language-compiler-architecture.md` budgeted
# `trust-symbols` under the resolver; this is the whole Clean closure —
# `trust-certify` pulls `clean-kernel`, `clean-elab`, `clean-parser`,
# `clean-auto`, `clean-verify`, `trust-spec-elab`, `trust-ir` and
# `trust-cert-meter`. None of them names a rustc crate, so there is no cycle.
# At RUNTIME the decision returns before allocating anything for a crate with no
# `clean { … }` island, so ordinary Rust never pays the kernel.
#
# tidy-alphabetical-start
clean-kernel = { workspace = true }
trust-certify = { workspace = true }
trust-clean-carrier = { workspace = true }
trust-clean-origin = { workspace = true }
trust-spec-elab = { workspace = true }
trust-symbols = { path = "../../crates/trust-symbols" }
trust-types = { workspace = true }
# tidy-alphabetical-end
