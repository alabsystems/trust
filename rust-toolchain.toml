# Trust-owned workspaces here (crates/, targo-trust/, tools/, examples/) build
# with the Trust toolchain (the owner, 2026-09-28: "we need to use Trust compiler
# for all ALab systems", docs/OWNER_RULINGS.md OW-37). `targo` chooses the
# verified or unverified lane; this pin only steers rustup shims (x.py reads
# bootstrap.toml's stage0, not this channel). The public snapshot ships this
# same pin (publication policy rule 3): on Apple-silicon macOS, install aterm
# and its atpkg installs Trust and links rustup's `trust` toolchain.
[toolchain]
channel = "trust"
